<title>Codebase Map</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Mukta:wght@400;500;600;700&family=Rozha+One&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a survey sheet. Sticky title strip and tab rail, one full-width view at a time,
   and a details panel that slides in from the right (a bottom sheet on phones). */
:root {
	--paper: #f1f3ef;
	--sheet: #ffffff;
	--sheet-2: #f7f8f5;
	--ink: #17201b;
	--ink-2: #45514a;
	--ink-3: #737e78;
	--rule: #d6dcd5;
	--grid: #e3e8e1;
	--accent: #cf1f2a;
	--accent-soft: #fbe3e2;
	--built: #1d7a4b;
	--built-soft: #dcefe3;
	--partial: #a86a0f;
	--partial-soft: #f7e9cf;
	--planned: #7a8580;
	--planned-soft: #eef1ed;
	--waiting: #6a4fbd;
	--waiting-soft: #ebe5fa;
	--k-app: #2f6cae;  --k-app-bg: #dbe7f5;
	--k-test: #1d8673; --k-test-bg: #d7eee8;
	--k-migration: #6852b3; --k-migration-bg: #e5e0f4;
	--k-config: #946610; --k-config-bg: #f2e8d0;
	--k-ci: #1a7c95;   --k-ci-bg: #d6edf3;
	--k-doc: #765f4b;  --k-doc-bg: #ebe5de;
	--k-design: #ad4359; --k-design-bg: #f5dfe3;
	--k-infra: #5c7729; --k-infra-bg: #e3ebd5;
	--k-tooling: #6b5784; --k-tooling-bg: #e8e3ee;
	--shadow: 0 1px 2px rgb(23 32 27 / 0.06), 0 8px 24px rgb(23 32 27 / 0.08);
	--display: "Rozha One", "Noto Serif Devanagari", Georgia, serif;
	--body: "Mukta", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
	--mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
	--gutter-l: max(16px, env(safe-area-inset-left, 0px));
	--gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--paper: #0f1311; --sheet: #171c19; --sheet-2: #1b211e; --ink: #e2e9e4; --ink-2: #b1bcb5; --ink-3: #85918a;
		--rule: #2b342f; --grid: #1a201d; --accent: #ff5a62; --accent-soft: #3c1618;
		--built: #5cc690; --built-soft: #163224; --partial: #e6aa4c; --partial-soft: #382b13;
		--planned: #8f9b95; --planned-soft: #1f2623; --waiting: #ab95f3; --waiting-soft: #2a2342;
		--k-app: #7fb0e6; --k-app-bg: #1b2a3b; --k-test: #5cc8b2; --k-test-bg: #15302b;
		--k-migration: #a895ee; --k-migration-bg: #26213b; --k-config: #ddb35d; --k-config-bg: #322915;
		--k-ci: #63c3dc; --k-ci-bg: #142d34; --k-doc: #c7ab92; --k-doc-bg: #2c2520;
		--k-design: #ec8ea2; --k-design-bg: #3a1e26; --k-infra: #a6c66b; --k-infra-bg: #232c17;
		--k-tooling: #b9a3d4; --k-tooling-bg: #2a2433;
		--shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--paper: #0f1311; --sheet: #171c19; --sheet-2: #1b211e; --ink: #e2e9e4; --ink-2: #b1bcb5; --ink-3: #85918a;
	--rule: #2b342f; --grid: #1a201d; --accent: #ff5a62; --accent-soft: #3c1618;
	--built: #5cc690; --built-soft: #163224; --partial: #e6aa4c; --partial-soft: #382b13;
	--planned: #8f9b95; --planned-soft: #1f2623; --waiting: #ab95f3; --waiting-soft: #2a2342;
	--k-app: #7fb0e6; --k-app-bg: #1b2a3b; --k-test: #5cc8b2; --k-test-bg: #15302b;
	--k-migration: #a895ee; --k-migration-bg: #26213b; --k-config: #ddb35d; --k-config-bg: #322915;
	--k-ci: #63c3dc; --k-ci-bg: #142d34; --k-doc: #c7ab92; --k-doc-bg: #2c2520;
	--k-design: #ec8ea2; --k-design-bg: #3a1e26; --k-infra: #a6c66b; --k-infra-bg: #232c17;
	--k-tooling: #b9a3d4; --k-tooling-bg: #2a2433;
	--shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35);
	color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
	background: var(--paper);
	color: var(--ink);
	font: 16px/1.55 var(--body);
	margin: 0;
}
body::before {
	content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
	z-index: 30; background: var(--sheet);
}
a { color: inherit; text-decoration-color: var(--ink-3); text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
code { background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* ---------- header */
.top {
	position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
	background: var(--sheet); border-bottom: 1px solid var(--rule);
}
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px 8px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; flex: 1 1 380px; }
.brand h1 { font: 400 1.65rem/1.1 var(--display); letter-spacing: 0.005em; }
.brand h1 span { color: var(--accent); }
.meta { color: var(--ink-3); font-size: 0.82rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.phase { font-weight: 600; color: var(--ink); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding: 1px 10px; border-radius: 99px; }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; background: var(--sheet-2); }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: 0.86rem; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); font-weight: 600; }
.search { position: relative; }
.search input {
	width: 260px; max-width: 100%; font: inherit; font-size: 0.92rem; color: var(--ink);
	background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 12px 6px 32px;
}
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 0.72rem var(--mono); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }
.results {
	position: absolute; right: 0; top: calc(100% + 6px); width: min(440px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
	background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 40;
}
.results button { display: grid; grid-template-columns: 82px 1fr; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; cursor: pointer; align-items: baseline; }
.results button:hover, .results button.on { background: var(--sheet-2); }
.results .k { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.results .t { min-width: 0; }
.results .t b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .t small { color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .none { padding: 10px; color: var(--ink-3); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
	border: 0; background: none; padding: 8px 12px 10px; font-size: 0.93rem; color: var(--ink-2); cursor: pointer; white-space: nowrap;
	border-bottom: 2px solid transparent;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

/* ---------- views */
main { padding-block: 22px 60px; }
.view[hidden] { display: none !important; }
.vhead { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
.vhead h2 { font: 400 1.9rem/1.15 var(--display); }
.lead { color: var(--ink-2); max-width: 70ch; margin-top: 4px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; min-width: 0; }
.sect { margin-top: 30px; }
.sect > h3 { font: 600 1.15rem/1.3 var(--body); margin-bottom: 4px; }
.sect > .lead { margin-bottom: 12px; font-size: 0.95rem; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.muted { color: var(--ink-3); }
.small { font-size: 0.86rem; }
.grid { display: grid; gap: 12px; }
.cols-auto { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* depth layers */
[data-depth="simple"] .L-detail, [data-depth="simple"] .L-tech, [data-depth="detailed"] .L-tech { display: none !important; }
.L-detail, .L-tech { margin-top: 8px; }
.L-tech { font-size: 0.9rem; color: var(--ink-2); border-left: 3px solid var(--rule); padding-left: 10px; }
.L-tech::before { content: "Technical · "; font-weight: 600; color: var(--ink-3); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }

/* status chips and refs */
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; font-weight: 600; padding: 1px 9px 1px 7px; border-radius: 99px; white-space: nowrap; border: 1px solid; line-height: 1.6; }
.st i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.st-built { color: var(--built); background: var(--built-soft); border-color: color-mix(in srgb, var(--built) 35%, transparent); }
.st-built i { background: var(--built); }
.st-partial { color: var(--partial); background: var(--partial-soft); border-color: color-mix(in srgb, var(--partial) 35%, transparent); }
.st-partial i { background: linear-gradient(90deg, var(--partial) 50%, transparent 50%); border: 1px solid var(--partial); }
.st-planned { color: var(--ink-2); background: var(--planned-soft); border-color: var(--rule); border-style: dashed; }
.st-planned i { border: 1.5px dashed var(--planned); }
.st-waiting { color: var(--waiting); background: var(--waiting-soft); border-color: color-mix(in srgb, var(--waiting) 35%, transparent); border-style: dotted; }
.st-waiting i { border: 2px dotted var(--waiting); }
.ref, .achip {
	display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet-2); border-radius: 8px;
	padding: 1px 8px; font-size: 0.86rem; cursor: pointer; text-align: left; max-width: 100%; color: var(--ink);
}
.ref:hover, .achip:hover { border-color: var(--ink-3); }
.ref .mono { color: var(--ink-3); font-size: 0.76rem; }
.ref .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.achip { font: 600 0.74rem var(--mono); padding: 0 6px; border-radius: 6px; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink); vertical-align: 1px; margin: 0 1px; }
.arefs { white-space: nowrap; }
.fdoc p { margin: 0 0 0.55em; } .fdoc ul { margin: 0 0 0.55em !important; } .fdoc p:last-child { margin-bottom: 0; }
.kind { font: 500 0.7rem var(--mono); padding: 0 6px; border-radius: 5px; background: var(--sheet-2); border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.gen { font: 500 0.7rem var(--mono); padding: 0 6px; border-radius: 5px; border: 1px dashed var(--ink-3); color: var(--ink-3); white-space: nowrap; }
.term { text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; text-decoration-thickness: 1.5px; cursor: help; }
.term:hover, .term:focus { text-decoration-color: var(--accent); }

/* legend */
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 0.84rem; color: var(--ink-2); }
.legend .sw { display: inline-block; width: 22px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 6px; border: 1.5px solid; }
.sw-built { background: var(--built-soft); border-color: var(--built) !important; }
.sw-partial { background: var(--partial-soft); border-color: var(--partial) !important; }
.sw-planned { background: var(--sheet); border-color: var(--planned) !important; border-style: dashed !important; }
.sw-waiting { background: var(--sheet); border-color: var(--waiting) !important; border-style: dotted !important; }
.sw-person { background: var(--ink); border-color: var(--ink) !important; border-radius: 99px !important; }

/* ---------- overview */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.tile:hover { border-color: var(--ink-3); }
.tile .n { font: 400 1.9rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.tile .l { font-weight: 600; font-size: 0.92rem; }
.tile .s { font-size: 0.8rem; color: var(--ink-3); }
.bar { height: 6px; border-radius: 6px; background: var(--planned-soft); overflow: hidden; display: flex; margin-top: 6px; }
.bar i { display: block; height: 100%; }
.mapcard { padding: 0; overflow: hidden; }
.maptools { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.lens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lens .eyebrow { margin-right: 4px; }
.lens button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 2px 11px; font-size: 0.82rem; cursor: pointer; color: var(--ink-2); }
.lens button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); font-weight: 600; }
.lens-note { padding: 8px 16px; font-size: 0.88rem; color: var(--ink-2); border-bottom: 1px solid var(--rule); background: var(--sheet-2); min-height: 2.4em; }
.svgbox { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.svgbox > svg { display: block; width: 100%; min-width: 860px; height: auto; }
.hint { font-size: 0.8rem; color: var(--ink-3); padding: 8px 16px 12px; }

/* system diagram */
.sys text { font-family: var(--body); }
.sys .bg { fill: var(--sheet); }
.sys .gridline { stroke: var(--grid); stroke-width: 1; }
.zone rect { fill: color-mix(in srgb, var(--paper) 55%, transparent); stroke: var(--rule); stroke-width: 1.2; stroke-dasharray: 2 3; }
.zone text { font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; fill: var(--ink-3); }
.zone.z-people rect { fill: none; stroke: none; }
.edge { stroke: var(--ink-3); stroke-width: 1.3; opacity: 0.42; fill: none; }
.edge.planned { stroke-dasharray: 4 4; opacity: 0.2; }
.ehit { stroke: transparent; stroke-width: 12; fill: none; cursor: help; }
.node { cursor: pointer; }
.node .nb { fill: var(--sheet); stroke: var(--planned); stroke-width: 1.6; }
.node .nl { font-size: 14px; font-weight: 600; fill: var(--ink); }
.node .ns { font-size: 10.5px; font-family: var(--mono); fill: var(--ink-3); }
.node .sd { fill: var(--planned); }
.node.s-built .nb { fill: var(--built-soft); stroke: var(--built); }
.node.s-built .sd { fill: var(--built); }
.node.s-partial .nb { fill: var(--partial-soft); stroke: var(--partial); }
.node.s-partial .sd { fill: var(--partial); }
.node.s-planned .nb { stroke-dasharray: 5 4; }
.node.s-waiting .nb { stroke: var(--waiting); stroke-dasharray: 1.5 3.5; stroke-width: 2; }
.node.s-waiting .sd { fill: var(--waiting); }
.node.person .nb { fill: var(--ink); stroke: var(--ink); }
.node.person .nl { fill: var(--sheet); }
.node.person .ns { fill: color-mix(in srgb, var(--sheet) 70%, transparent); }
.node:hover .nb, .node:focus-visible .nb, .node.act .nb { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: none; }
.node:focus { outline: none; }
.node.proj .nb { fill: var(--built-soft); stroke: var(--built); stroke-dasharray: none; }
.node.proj .sd { fill: var(--built); }
.node.later { opacity: 0.32; }
.sys.focusing .node:not(.hl), .sys.focusing .edge:not(.hl) { opacity: 0.18; }
.sys.focusing .edge.hl { opacity: 1; stroke: var(--accent); stroke-width: 2; }
.sys.journey .node:not(.inj) { opacity: 0.14; }
.sys.journey .edge { opacity: 0.08; }
.elabel rect { fill: var(--sheet); stroke: var(--accent); stroke-width: 1; }
.elabel text { font-size: 11px; fill: var(--ink); }
.trail-line { stroke: var(--accent); stroke-width: 2; opacity: 0.28; fill: none; }
.cur-line { stroke: var(--accent); stroke-width: 2.6; fill: none; stroke-dasharray: 7 5; animation: dash 1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -24; } }
.dot-run { fill: var(--accent); stroke: var(--sheet); stroke-width: 2.5; }
.pulse { fill: none; stroke: var(--accent); stroke-width: 2.4; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { opacity: 0.9; transform: scale(0.85); } to { opacity: 0; transform: scale(1.25); } }
.arrowhead { fill: var(--accent); }

.zonelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.zonelist h4 { font-size: 0.78rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.partrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--rule); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
.partrow:first-of-type { border-top: 0; }
.partrow b { font-weight: 600; }
.partrow p { grid-column: 1 / -1; font-size: 0.88rem; color: var(--ink-2); }
.partrow:hover b { text-decoration: underline; }

/* ---------- journeys */
.jgrid { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.jlist { display: flex; flex-direction: column; gap: 8px; }
.jbtn { text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.jbtn:hover { border-color: var(--ink-3); }
.jbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.jbtn b { font-weight: 600; }
.jbtn span { font-size: 0.84rem; color: var(--ink-2); }
.jbtn .bar { margin-top: 4px; }
.jstage { padding: 0; overflow: hidden; }
.caption { padding: 14px 16px; border-top: 1px solid var(--rule); display: grid; gap: 10px; }
.caption .head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.caption .count { font: 500 0.82rem var(--mono); color: var(--ink-3); }
.caption .text { font-size: 1.08rem; min-height: 3.2em; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 9px; padding: 5px 14px; cursor: pointer; font-size: 0.9rem; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--sheet); border-color: var(--ink); font-weight: 600; }
.btn:disabled { opacity: 0.4; cursor: default; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); font: 600 0.74rem var(--mono); cursor: pointer; color: var(--ink-2); }
.steps button.done { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.steps button[aria-current="step"] { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---------- code */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.9rem; margin-bottom: 10px; }
.crumbs button { border: 0; background: none; cursor: pointer; padding: 2px 4px; border-radius: 5px; color: var(--ink-2); font-family: var(--mono); font-size: 0.84rem; }
.crumbs button:hover { background: var(--sheet-2); color: var(--ink); }
.crumbs .sep { color: var(--ink-3); }
.crumbs .here { font-family: var(--mono); font-size: 0.84rem; font-weight: 600; }
.tree { position: relative; height: 500px; border-radius: 12px; background: var(--sheet-2); border: 1px solid var(--rule); overflow: hidden; }
.blk {
	position: absolute; border-radius: 8px; padding: 7px 9px; overflow: hidden; cursor: pointer; text-align: left;
	border: 1.5px solid; display: flex; flex-direction: column; gap: 1px; transition: filter 0.15s;
}
.blk:hover { filter: brightness(0.97) saturate(1.1); box-shadow: inset 0 0 0 1.5px var(--ink); }
.blk .bn { font: 500 0.74rem var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk .bt { font-weight: 600; font-size: 0.92rem; line-height: 1.25; color: var(--ink); }
.blk .bd { font-size: 0.8rem; color: var(--ink-2); line-height: 1.3; }
.blk .bm { font: 0.7rem var(--mono); color: var(--ink-3); margin-top: auto; }
.blk.folder { border-style: solid; border-width: 1.5px 1.5px 1.5px 6px; }
.blk.gen { border-style: dashed; }
.blk.tiny .bd, .blk.tiny .bm { display: none; }
.blk.tiny .bt { font-size: 0.78rem; }
.blk.micro > * { display: none; }
.blk.folder { cursor: zoom-in; }
.blk.folder .fh { border: 0; background: none; padding: 0; font: 600 0.8rem var(--mono); color: var(--ink); cursor: pointer; text-align: left; }
.blk.folder.nested .bd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini { position: absolute; z-index: 1; border: 1px solid; border-radius: 5px; padding: 2px 5px; font: 0.68rem/1.3 var(--mono); color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mini.dir { border-left-width: 4px; cursor: zoom-in; }
.mini:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.mini.gen { border-style: dashed; }
.kinds { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--ink-2); margin-top: 10px; }
.kinds span { display: inline-flex; gap: 6px; align-items: center; }
.kinds i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; }
.dep svg { display: block; width: 100%; height: auto; }
.dep .dn rect { fill: var(--sheet); stroke-width: 1.4; }
.dep .dn text { font-size: 12px; fill: var(--ink); font-family: var(--body); }
.dep .dn { cursor: pointer; }
.dep .dn:hover rect, .dep .dn.hl rect { stroke: var(--accent); stroke-width: 2.2; }
.dep .de { fill: none; stroke: var(--ink-3); stroke-width: 1.2; opacity: 0.45; }
.dep.focusing .dn:not(.hl) { opacity: 0.25; }
.dep.focusing .de { opacity: 0.08; }
.dep.focusing .de.hl { opacity: 1; stroke: var(--accent); stroke-width: 1.8; }
.dep .colh { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; fill: var(--ink-3); }
details.fold { border-top: 1px solid var(--rule); }
details.fold:last-child { border-bottom: 1px solid var(--rule); }
details.fold > summary { cursor: pointer; padding: 10px 2px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--ink-3); transition: transform 0.15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary b { font-family: var(--mono); font-size: 0.9rem; }
.flist { display: grid; gap: 2px; padding: 0 0 12px 18px; }
.frow { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr) auto; gap: 4px 14px; padding: 6px 8px; border-radius: 8px; text-align: left; border: 0; background: none; cursor: pointer; align-items: baseline; width: 100%; }
.frow:hover { background: var(--sheet); }
.frow .p { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-2); overflow-wrap: anywhere; }
.frow .d b { font-weight: 600; }
.frow .d { font-size: 0.9rem; }
.frow .m { font: 0.74rem var(--mono); color: var(--ink-3); white-space: nowrap; }

/* ---------- data */
.er .ent { cursor: pointer; }
.er .ent rect { fill: var(--sheet); stroke: var(--planned); stroke-width: 1.5; stroke-dasharray: 5 4; }
.er .ent.s-built rect { fill: var(--built-soft); stroke: var(--built); stroke-dasharray: none; }
.er .ent .en { font: 600 13.5px var(--mono); fill: var(--ink); }
.er .ent .es { font-size: 11.5px; fill: var(--ink-3); font-family: var(--body); }
.er .ent:hover rect, .er .ent.hl rect { stroke: var(--accent); stroke-width: 2.2; }
.er .rel { stroke: var(--ink-3); stroke-width: 1.3; fill: none; opacity: 0.55; }
.er .many { fill: var(--ink-3); }
.er .grp { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; fill: var(--ink-3); }
.er.focusing .ent:not(.hl) { opacity: 0.25; }
.er.focusing .rel:not(.hl), .er.focusing .many:not(.hl) { opacity: 0.1; }
.er.focusing .rel.hl { stroke: var(--accent); opacity: 1; stroke-width: 2; }
.statechain { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 10px; align-items: center; font-size: 0.9rem; }
.statechain .s { font: 500 0.82rem var(--mono); border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 2px 9px; }
.statechain .a { color: var(--ink-3); font-size: 0.82rem; text-align: center; border-bottom: 1px dashed var(--rule); }

table.t { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.t th { text-align: left; font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.c { text-align: center; }
.yes { color: var(--built); font-weight: 700; }
.no { color: var(--ink-3); }
.cond { color: var(--partial); font-size: 0.84rem; }

/* paywall checker */
.checker { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-weight: 600; font-size: 0.88rem; }
.field select { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 10px; width: 100%; }
.trace { display: grid; gap: 8px; counter-reset: tr; }
.trace li { list-style: none; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.trace li::before { counter-increment: tr; content: counter(tr); font: 600 0.76rem var(--mono); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--sheet-2); border: 1px solid var(--rule); color: var(--ink-2); }
.trace { padding: 0; margin: 0; }
.verdict { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 1.05rem; display: flex; gap: 10px; align-items: center; }
.verdict.ok { background: var(--built-soft); color: var(--built); border: 1px solid color-mix(in srgb, var(--built) 35%, transparent); }
.verdict.no { background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }

/* ---------- config */
.ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.rung { border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; background: var(--sheet); position: relative; }
.rung b { display: block; font-size: 1.02rem; }
.rung p { font-size: 0.84rem; color: var(--ink-2); }
.rung .cost { font-size: 0.78rem; color: var(--ink-3); margin-top: 6px; }
.rung .n { position: absolute; top: 8px; right: 10px; font: 600 0.8rem var(--mono); color: var(--ink-3); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 14px 0 10px; }
.filters button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 1px 10px; font-size: 0.8rem; cursor: pointer; color: var(--ink-2); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 10px; align-items: start; }
.lane { background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.lane > h4 { font-size: 0.82rem; display: flex; justify-content: space-between; gap: 8px; }
.lane > h4 span { color: var(--ink-3); font-family: var(--mono); font-weight: 500; }
.qcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; text-align: left; cursor: pointer; display: grid; gap: 4px; width: 100%; }
.qcard:hover { border-color: var(--ink-3); }
.qcard.built { box-shadow: inset 3px 0 0 var(--built); }
.qcard .q { font-weight: 600; font-size: 0.86rem; line-height: 1.3; }
.qcard .a { font-size: 0.82rem; color: var(--ink-2); line-height: 1.35; }
.qcard .row { gap: 4px; }
.lock { display: inline-block; width: 11px; height: 12px; vertical-align: -1px; }
.lock path, .lock rect { stroke: currentColor; fill: none; stroke-width: 1.6; }
.sgroup { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.sg h4 { font-size: 0.86rem; margin-bottom: 4px; }
.sg ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.sg li { font-size: 0.86rem; display: grid; gap: 1px; }
.sg li .mono { color: var(--ink); }

/* ---------- safety */
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.rule { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.rule svg { width: 30px; height: 34px; }
.rule svg path { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.rule svg polyline { fill: none; stroke: var(--accent); stroke-width: 2; }
.threats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.threat { display: grid; gap: 6px; text-align: left; cursor: pointer; }
.threat:hover { border-color: var(--ink-3); }
.threat .row { justify-content: space-between; }
.threat .tid { font: 600 0.82rem var(--mono); }
.stride { display: inline-flex; gap: 3px; }
.stride abbr { font: 700 0.72rem var(--mono); text-decoration: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; background: var(--ink); color: var(--sheet); }
.threat .lbl { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-right: 6px; }
.threat p { font-size: 0.88rem; }

/* ---------- build */
.pipe { display: flex; gap: 0; align-items: stretch; overflow-x: auto; padding-bottom: 6px; }
.stage { flex: 1 1 140px; min-width: 140px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.stage b { font-size: 0.98rem; }
.stage p { font-size: 0.84rem; color: var(--ink-2); }
.stage .jobs { display: grid; gap: 4px; margin-top: 4px; }
.stage .jobs div { font-size: 0.78rem; border: 1px solid var(--rule); border-radius: 7px; padding: 3px 7px; background: var(--sheet-2); }
.arrow { flex: 0 0 18px; display: grid; place-items: center; color: var(--ink-3); }
.pyramid { display: grid; gap: 6px; justify-items: center; }
.pyramid div { padding: 8px 10px; border-radius: 8px; text-align: center; font-size: 0.9rem; display: grid; }
.pyramid div b { font: 400 1.5rem/1 var(--display); }
.pyramid .e2e { width: 46%; background: var(--k-design-bg); border: 1.5px solid var(--k-design); }
.pyramid .int { width: 70%; background: var(--k-ci-bg); border: 1.5px solid var(--k-ci); }
.pyramid .unit { width: 94%; background: var(--k-test-bg); border: 1.5px solid var(--k-test); }
.tcases { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.tcases li { font-size: 0.86rem; display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.tcases li::before { content: "✓"; color: var(--built); font-weight: 700; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }

/* ---------- roadmap */
.track { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); position: relative; margin: 6px 0 18px; }
.track::before { content: ""; position: absolute; left: 7%; right: 7%; top: 13px; height: 3px; background: var(--rule); border-radius: 3px; }
.stop { position: relative; text-align: center; display: grid; justify-items: center; gap: 4px; background: none; border: 0; cursor: pointer; padding: 0 4px; }
.stop i { width: 28px; height: 28px; border-radius: 50%; border: 2px dashed var(--planned); background: var(--sheet); display: block; position: relative; z-index: 1; }
.stop.current i { border: 3px solid var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 15%, transparent); }
.stop.done i { border: 2px solid var(--built); background: var(--built); }
.stop b { font-size: 0.86rem; line-height: 1.2; }
.stop span { font-size: 0.74rem; color: var(--ink-3); }
.mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.mcard { display: grid; gap: 8px; align-content: start; }
.mcard.current { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.mcard h4 { font-size: 1.1rem; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 0.88rem; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 6px; }
.checks li.done::before { content: "✓"; color: var(--built); font-weight: 700; }
.checks li.todo::before { content: "○"; color: var(--ink-3); }
.checks li.feat::before { content: "–"; color: var(--ink-3); }
.timeline { display: grid; gap: 0; }
.commit { display: grid; grid-template-columns: 92px 18px minmax(0, 1fr); gap: 10px; align-items: baseline; position: relative; padding: 6px 0; }
.commit .d { font: 0.78rem var(--mono); color: var(--ink-3); text-align: right; }
.commit .pin { width: 10px; height: 10px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--ink-3); position: relative; top: 1px; }
.commit:first-child .pin { border-color: var(--accent); background: var(--accent); }
.commit .s { font-size: 0.92rem; }
.commit .h { font: 0.74rem var(--mono); color: var(--ink-3); margin-left: 6px; }
.ctype { font: 600 0.7rem var(--mono); padding: 0 6px; border-radius: 5px; margin-right: 6px; background: var(--sheet-2); border: 1px solid var(--rule); }
.ctype.feat { background: var(--built-soft); color: var(--built); }
.ctype.fix { background: var(--accent-soft); color: var(--accent); }
.ctype.docs { background: var(--k-doc-bg); color: var(--k-doc); }
.adr { display: grid; gap: 6px; }

/* ---------- glossary */
.gloss { columns: 2 340px; column-gap: 28px; }
.gl { break-inside: avoid; padding: 10px 0; border-top: 1px solid var(--rule); }
.gl b { font-weight: 700; }
.gl .al { font-size: 0.78rem; color: var(--ink-3); margin-left: 6px; }
.gl p { font-size: 0.92rem; color: var(--ink-2); }
.gl .letter { font: 400 1.4rem var(--display); color: var(--accent); }
.gfilter { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 12px; width: min(360px, 100%); }

/* ---------- functions view */
.fk { --c: var(--k-app); --cb: var(--k-app-bg); }
.fk-page, .fk-layout, .fk-meta, .fk-endpoint, .fk-action { --c: var(--accent); --cb: var(--accent-soft); }
.fk-component { --c: var(--k-design); --cb: var(--k-design-bg); }
.fk-hook, .fk-access, .fk-validate { --c: var(--k-migration); --cb: var(--k-migration-bg); }
.fk-task, .fk-script, .fk-startup, .fk-proxy, .fk-module { --c: var(--k-ci); --cb: var(--k-ci-bg); }
.fk-type { --c: var(--k-doc); --cb: var(--k-doc-bg); }
.fk-collection, .fk-global, .fk-field, .fk-object, .fk-value { --c: var(--k-config); --cb: var(--k-config-bg); }
.fk-class, .fk-method { --c: var(--k-tooling); --cb: var(--k-tooling-bg); }
.fkb { font: 600 0.68rem/1.5 var(--body); letter-spacing: 0.04em; text-transform: uppercase; padding: 0 7px; border-radius: 5px; border: 1px solid var(--c); background: var(--cb); color: var(--ink); white-space: nowrap; }
.fref .dot { background: var(--c); border-radius: 50%; }
.fsig { font: 0.8rem/1.45 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.fsig b { color: var(--ink); font-weight: 600; }
.egroups { display: grid; gap: 18px; }
.egroup h4 { font-size: 0.95rem; margin-bottom: 2px; }
.egroup > p { font-size: 0.86rem; color: var(--ink-3); margin-bottom: 8px; }
.ecards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 8px; }
.ecard { text-align: left; border: 1px solid var(--rule); border-left: 4px solid var(--c); background: var(--sheet); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 1px; min-width: 0; }
.ecard:hover { border-color: var(--c); }
.ecard .et { font: 0.78rem var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ecard b { font-weight: 600; overflow-wrap: anywhere; }
.ecard small { color: var(--ink-3); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.xbar input[type="search"] { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 9px; padding: 6px 12px; width: min(420px, 100%); }
.xbar label { font-size: 0.86rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.xbar select { font: inherit; font-size: 0.86rem; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 7px; padding: 2px 6px; }
.fpick { position: relative; }
.fpick .results { left: 0; right: auto; }
.fg { padding: 8px; }
.fg svg { display: block; }
.fg .gn { cursor: pointer; }
.fg .gn rect { fill: var(--cb); stroke: var(--c); stroke-width: 1.4; }
.fg .gn.focus rect { stroke-width: 3; }
.fg .gn:hover rect, .fg .gn.hl rect { stroke-width: 2.6; }
.fg .gn text { font-size: 12px; fill: var(--ink); font-family: var(--body); }
.fg .gn .gk { font-size: 10px; fill: var(--ink-3); }
.fg .ge { fill: none; stroke: var(--ink-3); stroke-width: 1.3; opacity: 0.55; }
.fg .ge.render { stroke-dasharray: 2 3; }
.fg .ge.use, .fg .ge.wire { stroke-dasharray: 7 4; }
.fg .gt { font-size: 10px; fill: var(--ink-3); }
.fg .colh { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; fill: var(--ink-3); }
.fg.focusing .gn:not(.hl):not(.focus) { opacity: 0.3; }
.fg.focusing .ge:not(.hl) { opacity: 0.1; }
.fg.focusing .ge.hl { opacity: 1; stroke: var(--accent); }
.fhead { display: grid; gap: 6px; margin-bottom: 14px; }
.fhead h3 { font: 400 1.5rem/1.15 var(--display); overflow-wrap: anywhere; }
.ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.ol .ol { margin-top: 5px; padding-left: 14px; border-left: 2px solid var(--rule); }
.o { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 8px; align-items: start; font-size: 0.9rem; line-height: 1.5; }
.o > .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 0.78rem; font-weight: 700; background: var(--sheet-2); border: 1px solid var(--rule); color: var(--ink-2); }
.o > .ob { min-width: 0; }
.o code { font-size: 0.78rem; }
.o .lbl { font-weight: 600; }
.o .tag { font-size: 0.72rem; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 5px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
.o-if > .ic, .o-switch > .ic { background: var(--partial-soft); color: var(--partial); border-color: color-mix(in srgb, var(--partial) 35%, transparent); }
.o-loop > .ic { background: var(--k-ci-bg); color: var(--k-ci); }
.o-ret > .ic { background: var(--built-soft); color: var(--built); border-color: color-mix(in srgb, var(--built) 35%, transparent); }
.o-throw > .ic, .o-exit > .ic { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.o-fx > .ic { background: var(--k-config-bg); color: var(--k-config); }
.o-call > .ic, .o-render > .ic, .o-use > .ic { background: var(--k-app-bg); color: var(--k-app); }
.o.minor { opacity: 0.75; }
.hide-minor .o.minor { display: none; }
.br { margin-top: 4px; }

<script>
'use strict'
;(() => {
	const M = window.MAP
	const app = document.getElementById('app')
	if (!M) {
		app.innerHTML = '<p class="fatal">The map data is missing. Run the map scanner (<code>node scripts/codebase-map/scan.mjs</code>) to create <code>data.js</code> next to this page.</p>'
		return
	}
	const C = M.content
	const F = M.facts
	const G = M.git
	// Every section of content.mjs is optional: missing ones are empty, and their tabs stay hidden.
	const EMPTY = { nodes: [], zones: [], edges: [], journeys: [], milestones: [], folders: {}, files: {}, tables: {}, commonColumns: {}, entities: {}, relations: [], dataLayout: {}, dataGroups: [], dataNotes: [], env: {}, commands: {}, routes: {}, services: {}, glossary: [] }
	for (const [k, v] of Object.entries(EMPTY)) C[k] ??= v
	C.project ||= {}
	C.project.name ||= String(C.project.title || '').replace(/\s*codebase map$/i, '') || 'Codebase'
	document.title = `${C.project.name} Codebase Map`
	document.getElementById('pname').textContent = C.project.name
	const CODE = window.MAP_CODE || { projects: [], symbols: [], entries: [], wiring: [], tests: {}, sources: {} }
	const CODE_ROOTS = (CODE.projects || []).map((p) => p.root).filter(Boolean).sort((a, b) => b.length - a.length)
	/** A path inside the code, without its project folder and src/: apps/web/src/lib/x.ts → lib/x.ts. */
	const shortPath = (f) => {
		const root = CODE_ROOTS.find((r) => f.startsWith(`${r}/`))
		return (root ? f.slice(root.length + 1) : f).replace(/^src\//, '')
	}

	// ------------------------------------------------------------ helpers
	const $ = (s, r = document) => r.querySelector(s)
	const $$ = (s, r = document) => [...r.querySelectorAll(s)]
	const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
	const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
	const base = (p) => p.split('/').pop()
	const fit = (s, n) => (s.length > n ? `${s.slice(0, n - 1)}…` : s)
	const store = {
		get(k) { try { return localStorage.getItem(`abmap:${k}`) } catch { return null } },
		set(k, v) { try { localStorage.setItem(`abmap:${k}`, v) } catch {} },
	}
	const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
	const fmtDate = (d) => {
		const [y, m, day] = d.split('-').map(Number)
		return `${day} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1]} ${y}`
	}

	const STATUS = { built: 'Built', partial: 'In progress', planned: 'Planned', waiting: 'Waiting on someone' }
	const chip = (s) => (s ? `<span class="st st-${s}"><i></i>${STATUS[s]}</span>` : '')

	// ------------------------------------------------------------ indexes
	const N = Object.fromEntries(C.nodes.map((n) => [n.id, n]))
	const PARTS = C.nodes.filter((n) => !n.person)
	const MS = C.milestones
	const msIdx = Object.fromEntries(MS.map((m, i) => [m.id, i]))
	const curMs = MS.findIndex((m) => m.status === 'current')
	// Open questions (content.questions): ids like Q1 or A3 link anywhere they're written as [Q1].
	const Q = C.questions || null
	const A = Object.fromEntries((Q?.items || []).map((a) => [a.id, { places: [], ...a, state: String(a.status || 'assumed').split(/\s/)[0].toLowerCase() }]))
	const AG = Object.fromEntries((Q?.groups || []).map((g) => [g.id, g.name]))
	const FILES = Object.fromEntries(F.files.map((f) => [f.path, f]))
	const FOLDERS = new Set(F.folders)
	const TESTS = Object.fromEntries(F.tests.map((t) => [t.file, t]))
	const ZONES = Object.fromEntries(C.zones.map((z) => [z.id, z]))
	const importedBy = {}
	for (const [f, i] of Object.entries(F.imports)) for (const t of i.internal) (importedBy[t] ||= []).push(f)
	const covering = Object.entries(C.folders).filter(([, f]) => f.covers).map(([p, f]) => ({ prefix: `${p}/`, path: p, f }))

	function fileInfo(path) {
		const own = C.files[path]
		if (own) return { title: own.title || base(path), ...own }
		const cov = covering.find((c) => path.startsWith(c.prefix))
		return cov ? { title: base(path), simple: cov.f.simple, coveredBy: cov.path } : { title: base(path), simple: '' }
	}
	const isGenerated = (path) => FILES[path]?.generated || C.files[path]?.generated
	function testsFor(path) {
		const set = new Set(C.files[path]?.tests || [])
		for (const t of F.tests) if (F.imports[t.file]?.internal.includes(path)) set.add(t.file)
		return [...set]
	}
	const nodesFor = (path) => PARTS.filter((n) => (n.files || []).some((f) => path === f || path.startsWith(`${f}/`)))
	const journeysFor = (id) => C.journeys.filter((j) => j.steps.some((s) => s.from === id || s.to === id || s.at === id))
	const nodeStatus = (n) => (n.person ? 'built' : n.status)
	const RANK = { waiting: 0, planned: 1, partial: 2, built: 3 }
	const worse = (a, b) => (RANK[a] <= RANK[b] ? a : b)
	function stepStatus(s) {
		if (s.status) return s.status
		const ends = [s.from, s.to, s.at].filter(Boolean).map((id) => nodeStatus(N[id]))
		return ends.reduce(worse, 'built')
	}

	// Entities: what the system stores (content.entities), each tied to the real tables the scanner found.
	const OTHER = '(other tables)'
	const ENT = {}
	for (const [slug, e] of Object.entries(C.entities)) ENT[slug] = { slug, kind: 'collection', group: '', ...e }
	for (const e of Object.values(ENT)) {
		e.tables = F.schema.tables.filter((t) => C.tables[t.name]?.entity === e.slug)
		e.status ||= e.tables.length ? 'built' : 'planned'
	}
	const otherTables = F.schema.tables.filter((t) => !ENT[C.tables[t.name]?.entity])
	if (Object.keys(ENT).length && otherTables.length) ENT[OTHER] = { slug: OTHER, kind: 'internal', group: '', tables: otherTables, status: 'built', simple: 'Tables in the database that no entity on the diagram claims.' }
	const KIND_LABEL = { collection: 'Collection', global: 'Global (one settings document)', table: 'Table', model: 'Model', auth: 'Sign-in tables', internal: 'Other tables', view: 'View' }

	// Env vars: .env.example, the validated schema, what the code reads, and content.env's explanations together.
	const ENV = new Map()
	for (const e of F.env.example) ENV.set(e.name, { name: e.name, section: e.section, planned: e.planned, notes: `In \`${F.env.exampleFile}\`${e.section ? ` (${e.section})` : ''}` })
	for (const name of [...F.env.schema, ...(F.env.used || []), ...Object.keys(C.env)]) if (!ENV.has(name)) ENV.set(name, { name })
	for (const v of ENV.values()) {
		v.inSchema = F.env.schema.includes(v.name)
		v.used = (F.env.used || []).includes(v.name)
		v.status = v.used || v.inSchema ? 'built' : 'planned'
		v.secret = /SECRET|PASSWORD|PASS$|_TOKEN$|API_KEY|_KEY$|PRIVATE|DATABASE_URL|ACCESS_KEY|CREDENTIALS|DSN$/.test(v.name) && !/^(NEXT_PUBLIC|VITE|PUBLIC|EXPO_PUBLIC|NUXT_PUBLIC)_/.test(v.name)
		v.explain = C.env[v.name] || ''
	}

	const TH = C.threats || null
	const THREATS = (TH?.areas || []).flatMap((a) => (a.threats || []).map((t) => ({ stride: [], status: 'planned', ...t, area: a.area })))
	const STRIDE = { S: 'Spoofing: pretending to be someone else', T: 'Tampering: changing data or code', R: 'Repudiation: denying having done something', I: 'Information disclosure: data leaking', D: 'Denial of service: knocking it offline', E: 'Elevation of privilege: getting more power than allowed' }

	// ------------------------------------------------------------ text rendering
	function expandIds(s) {
		const out = []
		for (const part of s.split(/\s*,\s*/)) {
			const r = part.match(/^([A-Z])(\d+)\s*[–-]\s*([A-Z])?(\d+)$/)
			if (r) for (let i = +r[2]; i <= +r[4]; i++) out.push(r[1] + i)
			else if (/^[A-Z]\d+$/.test(part)) out.push(part)
			else return null
		}
		return out
	}
	const aChip = (id) => `<button type="button" class="achip" data-open="assumption:${id}" title="${esc(A[id]?.question || '')}">${id}</button>`
	function docRef(url, text) {
		const clean = url.split('#')[0]
		const name = decodeURIComponent(base(clean))
		const hit = F.files.find((f) => base(f.path) === name && (clean.includes('/') ? f.path.endsWith(clean.replace(/^(\.\.\/)+/, '')) : true)) || F.files.find((f) => base(f.path) === name)
		return hit ? `<button type="button" class="ref" data-open="file:${esc(hit.path)}">${text}</button>` : text
	}
	/** Inline Markdown. `plain` is for text inside a button: no nested buttons or links. */
	function md(s, plain = false) {
		if (!s) return ''
		let h = esc(s)
		const codes = []
		h = h.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000` })
		h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => (plain ? t : /^https?:/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : docRef(u, t)))
		h = h.replace(/\[([A-Z]\d+(?:\s*[–,-]\s*[A-Z]?\d+)*)\]/g, (m, ids) => {
			const list = expandIds(ids)
			if (!list || !list.every((id) => A[id])) return m
			return `<span class="arefs">${list.map((id) => (plain ? `<span class="achip">${id}</span>` : aChip(id))).join('')}</span>`
		})
		h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
		h = h.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[+i]}</code>`)
		return h
	}
	const mdp = (s) => md(s, true)
	function mdBlock(s) {
		if (!s) return ''
		const out = []
		let list = null
		for (const raw of s.split('\n')) {
			const li = raw.match(/^(\s*)[-*]\s+(.+)$/)
			if (li) {
				if (!list) { list = []; out.push(list) }
				list.push(`<li${li[1].length ? ' style="margin-left:16px"' : ''}>${md(li[2])}</li>`)
			} else if (raw.trim()) {
				list = null
				out.push(`<p>${md(raw.trim())}</p>`)
			} else list = null
		}
		return out.map((x) => (Array.isArray(x) ? `<ul style="margin:0;padding-left:18px;display:grid;gap:4px">${x.join('')}</ul>` : x)).join('')
	}
	/** The three depths of one item. Each layer is shown or hidden by the depth switch. */
	function layers(item, fallback = '') {
		const simple = item.simple || fallback
		return `${simple ? `<p class="tx">${md(simple)}</p>` : ''}${item.detail ? `<div class="L-detail tx">${md(item.detail)}</div>` : ''}${item.tech ? `<div class="L-tech tx">${md(item.tech)}</div>` : ''}`
	}
	const fileRef = (p) => {
		const f = FILES[p]
		const isFolder = !f && FOLDERS.has(p)
		const label = isFolder ? `${base(p)}/` : fileInfo(p).title
		const color = f ? `style="background:var(--k-${f.kind})"` : 'style="background:var(--ink-3)"'
		return `<button type="button" class="ref" data-open="${isFolder ? 'folder' : 'file'}:${esc(p)}" title="${esc(p)}"><span class="dot" ${color}></span>${esc(label)}</button>`
	}
	const nodeRef = (id) => `<button type="button" class="ref" data-open="node:${id}">${esc(N[id].label)}</button>`
	const refs = (list) => `<div class="refs">${list.join('')}</div>`

	// Glossary links: the first mention of each term in a view or panel is underlined.
	const TERMS = C.glossary
	const TERM_MAP = new Map()
	const aliases = []
	TERMS.forEach((g, i) => {
		if (g.noLink) return
		for (const a of [g.term, ...(g.aliases || [])]) {
			TERM_MAP.set(a.toLowerCase(), { i, alias: a, cs: !/[a-z]/.test(a) })
			aliases.push(a)
		}
	})
	aliases.sort((a, b) => b.length - a.length)
	const TERM_RE = new RegExp(`(?<![\\w-])(${aliases.map(escRe).join('|')})(?![\\w-])`, 'gi')
	function linkTerms(root) {
		if (!aliases.length) return
		const seen = new Set()
		for (const block of $$('.tx', root)) {
			const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
				acceptNode: (t) => (t.parentElement.closest('code,a,button,.term,.ref,svg') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
			})
			const texts = []
			while (walker.nextNode()) texts.push(walker.currentNode)
			for (const node of texts) {
				const s = node.nodeValue
				let frag = null
				let last = 0
				TERM_RE.lastIndex = 0
				for (let m = TERM_RE.exec(s); m; m = TERM_RE.exec(s)) {
					const hit = TERM_MAP.get(m[1].toLowerCase())
					if (!hit || (hit.cs && m[1] !== hit.alias) || seen.has(hit.i)) continue
					seen.add(hit.i)
					frag ||= document.createDocumentFragment()
					frag.append(s.slice(last, m.index))
					const sp = document.createElement('span')
					sp.className = 'term'
					sp.tabIndex = 0
					sp.dataset.term = hit.i
					sp.textContent = m[1]
					frag.append(sp)
					last = m.index + m[1].length
				}
				if (frag) {
					frag.append(s.slice(last))
					node.replaceWith(frag)
				}
			}
		}
	}

	// ------------------------------------------------------------ header
	$('#meta').innerHTML = `${C.project.phase ? `<span class="phase">${esc(C.project.phase)}</span>` : ''}<span>Facts from commit <span class="mono">${esc(G.head)}</span> · ${fmtDate(G.date)}${G.dirty ? ' (plus uncommitted changes)' : ''}</span>`

	// A tab shows only when there's something to put on it.
	const HAS = {
		overview: C.nodes.length > 0,
		journeys: C.journeys.length > 0 && C.nodes.length > 0,
		code: true,
		functions: CODE.symbols.length > 0 || Boolean(CODE.missing),
		data: F.schema.tables.length > 0 || Object.keys(C.entities).length > 0,
		access: Boolean(C.access),
		config: ENV.size > 0 || Boolean(Q) || Boolean(C.settings),
		safety: F.rules.hard.length > 0 || THREATS.length > 0,
		build: true,
		roadmap: C.milestones.length > 0 || G.log.length > 0,
		glossary: C.glossary.length > 0,
	}
	const VIEWS = [
		['overview', 'Big picture'], ['journeys', 'Journeys'], ['code', 'Code'], ['functions', 'Functions'], ['data', 'Data'], ['access', 'Who can do what'],
		['config', Q ? 'Settings & questions' : 'Settings'], ['safety', 'Safety'], ['build', 'How we build'], ['roadmap', 'Roadmap'], ['glossary', 'Glossary'],
	].filter(([id]) => HAS[id])
	$('#tabs').innerHTML = VIEWS.map(([id, label]) => `<button type="button" role="tab" id="tab-${id}" data-view="${id}" aria-selected="false" aria-controls="v-${id}">${label}</button>`).join('')
	$('#views').innerHTML = VIEWS.map(([id]) => `<section class="view" id="v-${id}" role="tabpanel" aria-labelledby="tab-${id}" hidden></section>`).join('')

	let depth = store.get('depth') || 'simple'
	function setDepth(d) {
		depth = d
		app.dataset.depth = d
		document.body.dataset.depth = d
		for (const b of $$('#depth button')) b.setAttribute('aria-pressed', String(b.dataset.depth === d))
		store.set('depth', d)
	}
	setDepth(['simple', 'detailed', 'technical'].includes(depth) ? depth : 'simple')
	$('#depth').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setDepth(b.dataset.depth) })

	const rendered = {}
	let current = null
	function show(view, { scroll = true } = {}) {
		if (!VIEWS.some(([id]) => id === view)) view = VIEWS[0][0]
		if (current === 'journeys' && view !== 'journeys') J.pause()
		current = view
		for (const [id] of VIEWS) {
			$(`#v-${id}`).hidden = id !== view
			$(`#tab-${id}`).setAttribute('aria-selected', String(id === view))
		}
		if (!rendered[view]) {
			const el = $(`#v-${view}`)
			RENDER[view](el)
			linkTerms(el)
			rendered[view] = true
		}
		$(`#tab-${view}`).scrollIntoView({ block: 'nearest', inline: 'nearest' })
		try { history.replaceState(null, '', `#${view}`) } catch {}
		store.set('view', view)
		if (scroll) window.scrollTo({ top: 0 })
	}
	$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) show(b.dataset.view) })

	const vhead = (title, lead, extra = '') => `<div class="vhead"><div><h2>${title}</h2><p class="lead tx">${lead}</p></div>${extra}</div>`
	const legend = (withPeople = true) => `<div class="legend">${withPeople ? '<span><i class="sw sw-person"></i>People</span>' : ''}<span><i class="sw sw-built"></i>Built</span><span><i class="sw sw-partial"></i>In progress</span><span><i class="sw sw-planned"></i>Planned</span><span><i class="sw sw-waiting"></i>Waiting</span></div>`

	// ------------------------------------------------------------ system diagram
	const SYS_W = 1200
	const SYS_H = 820
	function box(n) {
		const w = n.w || (n.person ? 150 : 156)
		const h = n.person ? 44 : 50
		return { x: n.x - w / 2, y: n.y - h / 2, w, h }
	}
	function clip(n, tx, ty, gap = 4) {
		const b = box(n)
		const dx = tx - n.x
		const dy = ty - n.y
		if (!dx && !dy) return [n.x, n.y]
		const t = Math.min(dx ? (b.w / 2 + gap) / Math.abs(dx) : Infinity, dy ? (b.h / 2 + gap) / Math.abs(dy) : Infinity)
		return [n.x + dx * t, n.y + dy * t]
	}
	function seg(a, b) {
		const [x1, y1] = clip(a, b.x, b.y)
		const [x2, y2] = clip(b, a.x, a.y)
		return { x1, y1, x2, y2 }
	}
	function systemSVG(id) {
		let grid = ''
		for (let x = 40; x < SYS_W; x += 40) grid += `<line class="gridline" x1="${x}" y1="0" x2="${x}" y2="${SYS_H}"/>`
		for (let y = 40; y < SYS_H; y += 40) grid += `<line class="gridline" x1="0" y1="${y}" x2="${SYS_W}" y2="${y}"/>`
		const zones = C.zones.map((z) => `<g class="zone z-${z.id}"><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="14"/><text x="${z.x + 12}" y="${z.y + 20}">${esc(z.label)}</text></g>`).join('')
		const edges = C.edges.map((e, i) => {
			const s = seg(N[e.from], N[e.to])
			const planned = [e.from, e.to].some((x) => RANK[nodeStatus(N[x])] < 2)
			const attrs = `x1="${s.x1.toFixed(1)}" y1="${s.y1.toFixed(1)}" x2="${s.x2.toFixed(1)}" y2="${s.y2.toFixed(1)}"`
			return `<line class="edge${planned ? ' planned' : ''}" data-e="${i}" ${attrs}/><line class="ehit" data-e="${i}" ${attrs}><title>${esc(`${N[e.from].label} ↔ ${N[e.to].label}: ${e.label}`)}</title></line>`
		}).join('')
		const nodes = C.nodes.map((n) => {
			const b = box(n)
			const st = nodeStatus(n)
			const cls = n.person ? 'person' : `s-${st}`
			const tx = n.person ? b.w / 2 : 12
			const anchor = n.person ? ' text-anchor="middle"' : ''
			const label = n.person ? `${n.label}, people` : `${n.label}, ${STATUS[st]}`
			return `<g class="node ${cls}" data-node="${n.id}" tabindex="0" role="button" aria-label="${esc(label)}" transform="translate(${b.x} ${b.y})">
				<rect class="nb" width="${b.w}" height="${b.h}" rx="${n.person ? b.h / 2 : 9}"/>
				${n.person ? '' : `<circle class="sd" cx="${b.w - 12}" cy="12" r="4.5"/>`}
				<text class="nl" x="${tx}" y="${b.h / 2 - 2}"${anchor}>${esc(n.label)}</text>
				<text class="ns" x="${tx}" y="${b.h / 2 + 13}"${anchor}>${esc(fit(n.sub || '', Math.floor((b.w - 26) / 6.4)))}</text>
			</g>`
		}).join('')
		return `<svg class="sys" id="${id}" viewBox="0 0 ${SYS_W} ${SYS_H}" role="group" aria-label="System diagram: every part of the platform and how they connect">
			<defs><marker id="${id}-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
			<rect class="bg" width="${SYS_W}" height="${SYS_H}"/>${grid}${zones}
			<g class="edges">${edges}</g><g class="trail"></g><g class="nodes">${nodes}</g><g class="fx"></g>
		</svg>`
	}
	function edgeLabels(svg, list) {
		const fx = $('.fx', svg)
		fx.innerHTML = list.map((e) => {
			const s = seg(N[e.from], N[e.to])
			const mx = (s.x1 + s.x2) / 2
			const my = (s.y1 + s.y2) / 2
			const w = Math.min(240, e.label.length * 6.1 + 14)
			return `<g class="elabel" transform="translate(${mx - w / 2} ${my - 10})"><rect width="${w}" height="20" rx="6"/><text x="${w / 2}" y="14" text-anchor="middle">${esc(e.label.length > 38 ? `${e.label.slice(0, 37)}…` : e.label)}</text></g>`
		}).join('')
	}
	function wireSystem(svg, { hover = true } = {}) {
		const focusNode = (id) => {
			if (!hover || svg.classList.contains('journey')) return
			svg.classList.add('focusing')
			const linked = C.edges.map((e, i) => ({ e, i })).filter(({ e }) => e.from === id || e.to === id)
			const ids = new Set([id, ...linked.flatMap(({ e }) => [e.from, e.to])])
			for (const g of $$('.node', svg)) g.classList.toggle('hl', ids.has(g.dataset.node))
			for (const l of $$('.edge', svg)) l.classList.toggle('hl', linked.some(({ i }) => String(i) === l.dataset.e))
			edgeLabels(svg, linked.map(({ e }) => e))
		}
		const blur = () => {
			if (svg.classList.contains('journey')) return
			svg.classList.remove('focusing')
			for (const el of $$('.hl', svg)) el.classList.remove('hl')
			$('.fx', svg).innerHTML = ''
		}
		svg.addEventListener('mouseover', (e) => { const g = e.target.closest('.node'); if (g) focusNode(g.dataset.node) })
		svg.addEventListener('mouseout', (e) => { const g = e.target.closest('.node'); if (g && !g.contains(e.relatedTarget)) blur() })
		svg.addEventListener('focusin', (e) => { const g = e.target.closest('.node'); if (g) focusNode(g.dataset.node) })
		svg.addEventListener('focusout', blur)
		svg.addEventListener('click', (e) => { const g = e.target.closest('.node'); if (g) openPanel(`node:${g.dataset.node}`) })
		svg.addEventListener('keydown', (e) => {
			const g = e.target.closest('.node')
			if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPanel(`node:${g.dataset.node}`) }
		})
	}
	function applyLens(svg, k) {
		for (const g of $$('.node', svg)) {
			const n = N[g.dataset.node]
			if (n.person) continue
			const later = k >= 0 && msIdx[n.milestone] > k
			g.classList.toggle('proj', k >= 0 && !later)
			g.classList.toggle('later', later)
		}
	}

	// ------------------------------------------------------------ views
	const RENDER = {}

	RENDER.overview = (el) => {
		const counts = Object.fromEntries(Object.keys(STATUS).map((s) => [s, PARTS.filter((n) => n.status === s).length]))
		const appFiles = F.files.filter((f) => ['app', 'test'].includes(f.kind) && !isGenerated(f.path) && f.lines)
		const appLines = appFiles.reduce((s, f) => s + f.lines, 0)
		const byLevel = (l) => F.tests.filter((t) => t.level === l).reduce((s, t) => s + t.count, 0)
		const totalTests = F.tests.reduce((s, t) => s + t.count, 0)
		const ents = Object.values(ENT).filter((e) => e.slug !== OTHER)
		const open = Object.values(A).filter((a) => a.state === 'assumed')
		const bar = (parts) => `<div class="bar">${parts.map(([v, c]) => `<i style="width:${(v / PARTS.length) * 100}%;background:var(--${c})"></i>`).join('')}</div>`
		el.innerHTML = `${vhead('The big picture', md(C.project.intro || ''))}
		<div class="tiles">
			<button class="tile" type="button" data-go="${HAS.roadmap ? 'roadmap' : 'overview'}"><span class="n">${counts.built + counts.partial}<span class="muted" style="font-size:1rem"> / ${PARTS.length}</span></span><span class="l">Parts started</span><span class="s">${counts.built} built · ${counts.partial} in progress${counts.waiting ? ` · ${counts.waiting} waiting` : ''}</span>${bar([[counts.built, 'built'], [counts.partial, 'partial'], [counts.waiting, 'waiting']])}</button>
			<button class="tile" type="button" data-go="code"><span class="n">${appLines.toLocaleString()}</span><span class="l">Lines of code</span><span class="s">${appFiles.length} hand-written code and test files</span></button>
			${totalTests ? `<button class="tile" type="button" data-go="build"><span class="n">${totalTests}</span><span class="l">Automated tests</span><span class="s">${byLevel('unit')} unit · ${byLevel('int')} integration · ${byLevel('e2e')} browser</span></button>` : ''}
			${HAS.functions && CODE.symbols.length ? `<button class="tile" type="button" data-go="functions"><span class="n">${CODE.symbols.filter((s) => s.params).length}</span><span class="l">Functions</span><span class="s">${CODE.entries.length} entry points</span></button>` : ''}
			${HAS.data ? `<button class="tile" type="button" data-go="data"><span class="n">${F.schema.tables.length}</span><span class="l">Database tables</span><span class="s">${ents.length ? `${ents.filter((e) => e.status === 'built').length} of ${ents.length} entities built` : 'read from the schema'}</span></button>` : ''}
			${Q ? `<button class="tile" type="button" data-go="config"><span class="n">${open.length}</span><span class="l">Questions still assumed</span><span class="s">${Object.keys(A).length - open.length} answered · ${Object.values(A).filter((a) => a.built).length} built in${Q.waiting?.length ? ` · ${Q.waiting.length} blockers` : ''}</span></button>` : ''}
		</div>
		<div class="card mapcard">
			<div class="maptools">
				<div class="lens" id="lens" role="group" aria-label="Show the system at a milestone">
					<span class="eyebrow">Show the system</span>
					<button type="button" data-k="-1" aria-pressed="true">Today</button>
					${MS.map((m, i) => `<button type="button" data-k="${i}" aria-pressed="false">after ${esc(m.name)}</button>`).join('')}
				</div>
				${legend()}
			</div>
			<div class="lens-note tx" id="lensNote"></div>
			<div class="svgbox">${systemSVG('sysMain')}</div>
			<p class="hint">Hover a part to see what it talks to; click it for the full story. On a phone, swipe sideways to see the whole diagram.</p>
		</div>
		<div class="sect">
			<h3>Every part, by where it runs</h3>
			<p class="lead">The same parts as the diagram, as a list.</p>
			<div class="zonelist">${C.zones.map((z) => {
				const list = C.nodes.filter((n) => n.zone === z.id)
				return `<div class="card"><h4>${esc(z.label)}</h4>${list.map((n) => `<button type="button" class="partrow" data-open="node:${n.id}"><b>${esc(n.label)}</b>${n.person ? '<span class="kind">people</span>' : chip(n.status)}<p class="tx">${mdp(n.simple)}</p></button>`).join('')}</div>`
			}).join('')}</div>
		</div>`
		const svg = $('#sysMain', el)
		wireSystem(svg)
		const note = $('#lensNote', el)
		const setLens = (k) => {
			applyLens(svg, k)
			for (const b of $$('#lens button', el)) b.setAttribute('aria-pressed', String(+b.dataset.k === k))
			if (k < 0) {
				note.innerHTML = md(`**Today:** ${counts.built} built, ${counts.partial} in progress, ${counts.planned} planned and ${counts.waiting} waiting for the client. Solid boxes exist; dashed ones are designed but not built yet.`)
			} else {
				const have = PARTS.filter((n) => msIdx[n.milestone] <= k).length
				const adds = PARTS.filter((n) => msIdx[n.milestone] === k)
				note.innerHTML = md(`**After ${MS[k].name}:** ${have} of ${PARTS.length} parts exist. ${MS[k].simple} ${adds.length ? `Adds: ${adds.map((n) => n.label).join(', ')}.` : ''}`)
			}
			lensK = k
		}
		$('#lens', el).addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setLens(+b.dataset.k) })
		setLens(lensK)
	}
	let lensK = -1

	// ---------- journeys
	const J = (() => {
		let svg = null
		let j = null
		let i = 0
		let timer = null
		let raf = 0
		const steps = () => j.steps
		function draw() {
			cancelAnimationFrame(raf)
			const trail = $('.trail', svg)
			const fx = $('.fx', svg)
			const involved = new Set(j.steps.flatMap((s) => [s.from, s.to, s.at]).filter(Boolean))
			for (const g of $$('.node', svg)) {
				g.classList.toggle('inj', involved.has(g.dataset.node))
				g.classList.remove('act')
			}
			const line = (s, cls, marker) => {
				const p = seg(N[s.from], N[s.to])
				return `<line class="${cls}" x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}"${marker ? ` marker-end="url(#${svg.id}-arrow)"` : ''}/>`
			}
			trail.innerHTML = j.steps.slice(0, i).filter((s) => s.from).map((s) => line(s, 'trail-line')).join('')
			const s = j.steps[i]
			for (const id of [s.from, s.to, s.at].filter(Boolean)) $(`.node[data-node="${id}"]`, svg)?.classList.add('act')
			if (s.at) {
				const b = box(N[s.at])
				fx.innerHTML = `<rect class="pulse" x="${b.x - 6}" y="${b.y - 6}" width="${b.w + 12}" height="${b.h + 12}" rx="14"/>`
			} else {
				const p = seg(N[s.from], N[s.to])
				fx.innerHTML = `${line(s, 'cur-line', true)}<circle class="dot-run" r="7" cx="${reduceMotion ? p.x2 : p.x1}" cy="${reduceMotion ? p.y2 : p.y1}"/>`
				if (!reduceMotion) {
					const dot = $('.dot-run', fx)
					const t0 = performance.now()
					const run = (t) => {
						const k = Math.min(1, (t - t0) / 1100)
						const e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2
						dot.setAttribute('cx', p.x1 + (p.x2 - p.x1) * e)
						dot.setAttribute('cy', p.y1 + (p.y2 - p.y1) * e)
						if (k < 1) raf = requestAnimationFrame(run)
					}
					raf = requestAnimationFrame(run)
				}
			}
			const st = stepStatus(s)
			const cap = $('#jcap')
			cap.querySelector('.count').textContent = `Step ${i + 1} of ${steps().length}`
			cap.querySelector('.stchip').innerHTML = `${chip(st)}${st === 'built' || st === 'partial' ? '' : '<span class="small muted">how it will work</span>'}`
			const txt = cap.querySelector('.text')
			txt.innerHTML = md(s.text)
			linkTerms(cap)
			$('#jprev').disabled = i === 0
			$('#jnext').disabled = i === steps().length - 1
			for (const b of $$('#jsteps button')) {
				const k = +b.dataset.i
				b.classList.toggle('done', k < i)
				if (k === i) b.setAttribute('aria-current', 'step')
				else b.removeAttribute('aria-current')
			}
		}
		function select(id) {
			pause()
			j = C.journeys.find((x) => x.id === id) || C.journeys[0]
			i = 0
			for (const b of $$('.jbtn')) b.setAttribute('aria-pressed', String(b.dataset.j === j.id))
			$('#jtitle').textContent = j.title
			$('#jsimple').innerHTML = md(j.simple)
			$('#jdocs').innerHTML = (j.docs || []).map(fileRef).join('')
			$('#jsteps').innerHTML = j.steps.map((_, k) => `<button type="button" data-i="${k}" aria-label="Step ${k + 1}">${k + 1}</button>`).join('')
			store.set('journey', j.id)
			draw()
		}
		function go(k) { i = Math.max(0, Math.min(steps().length - 1, k)); draw() }
		function play() {
			if (i === steps().length - 1) go(0)
			$('#jplay').textContent = 'Pause'
			timer = setInterval(() => {
				if (i >= steps().length - 1) return pause()
				go(i + 1)
			}, 3800)
		}
		function pause() {
			clearInterval(timer)
			timer = null
			const b = $('#jplay')
			if (b) b.textContent = 'Play'
		}
		function render(el) {
			el.innerHTML = `${vhead('Journeys', 'Follow one thing as it moves through the system, step by step. Steps that already work are marked <b>Built</b>; the rest show how it will work.')}
			<div class="jgrid">
				<div class="jlist" role="group" aria-label="Choose a journey">${C.journeys.map((x) => {
					const ok = x.steps.filter((s) => RANK[stepStatus(s)] >= 2).length
					return `<button type="button" class="jbtn" data-j="${x.id}" aria-pressed="false"><b>${esc(x.title)}</b><span>${mdp(x.simple)}</span><span class="small muted">${ok} of ${x.steps.length} steps work today</span></button>`
				}).join('')}</div>
				<div class="card jstage">
					<div class="maptools"><div><h3 id="jtitle" style="font-size:1.15rem"></h3><p class="small muted tx" id="jsimple"></p></div>${legend()}</div>
					<div class="svgbox">${systemSVG('sysJourney')}</div>
					<div class="caption" id="jcap">
						<div class="head"><span class="count"></span><span class="stchip row"></span></div>
						<p class="text tx" aria-live="polite"></p>
						<div class="controls">
							<button type="button" class="btn" id="jprev">← Back</button>
							<button type="button" class="btn primary" id="jplay">Play</button>
							<button type="button" class="btn" id="jnext">Next →</button>
							<div class="steps" id="jsteps" role="group" aria-label="Steps"></div>
						</div>
						<div class="row small"><span class="muted">Written up in</span><span id="jdocs" class="refs row"></span></div>
					</div>
				</div>
			</div>`
			svg = $('#sysJourney', el)
			svg.classList.add('journey')
			wireSystem(svg, { hover: false })
			$('.jlist', el).addEventListener('click', (e) => { const b = e.target.closest('.jbtn'); if (b) select(b.dataset.j) })
			$('#jprev').addEventListener('click', () => { pause(); go(i - 1) })
			$('#jnext').addEventListener('click', () => { pause(); go(i + 1) })
			$('#jplay').addEventListener('click', () => (timer ? pause() : play()))
			$('#jsteps').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { pause(); go(+b.dataset.i) } })
			select(store.get('journey') || C.journeys[0].id)
		}
		return { render, select, pause, key(e) {
			if (current !== 'journeys' || !j) return
			if (e.key === 'ArrowRight') { pause(); go(i + 1) }
			if (e.key === 'ArrowLeft') { pause(); go(i - 1) }
		} }
	})()
	RENDER.journeys = J.render

	// ---------- code
	const KINDS = { app: 'App code', test: 'Tests', migration: 'Migrations', config: 'Config', ci: 'CI', doc: 'Docs', design: 'Design & assets', infra: 'Infra', tooling: 'Tooling' }
	const TREE = (() => {
		const root = { name: 'repo', path: '', dirs: new Map(), files: [] }

	function squarify(items, W, H) {
		const total = items.reduce((s, x) => s + x.weight, 0)
		const scale = (W * H) / total
		const out = []
		let rect = { x: 0, y: 0, w: W, h: H }
		let row = []
		const worst = (r, len) => {
			const s = r.reduce((a, x) => a + x.area, 0)
			const mx = Math.max(...r.map((x) => x.area))
			const mn = Math.min(...r.map((x) => x.area))
			return Math.max((len * len * mx) / (s * s), (s * s) / (len * len * mn))
		}
		const lay = (r) => {
			const s = r.reduce((a, x) => a + x.area, 0)
			if (rect.w >= rect.h) {
				const cw = s / rect.h
				let cy = rect.y
				for (const x of r) { const ch = x.area / cw; out.push({ ...x, x: rect.x, y: cy, w: cw, h: ch }); cy += ch }
				rect = { x: rect.x + cw, y: rect.y, w: rect.w - cw, h: rect.h }
			} else {
				const ch = s / rect.w
				let cx = rect.x
				for (const x of r) { const cw = x.area / ch; out.push({ ...x, x: cx, y: rect.y, w: cw, h: ch }); cx += cw }
				rect = { x: rect.x, y: rect.y + ch, w: rect.w, h: rect.h - ch }
			}
		}
		for (const it of items.map((x) => ({ ...x, area: x.weight * scale }))) {
			const len = Math.min(rect.w, rect.h)
			if (!row.length || worst([...row, it], len) <= worst(row, len)) row.push(it)
			else { lay(row); row = [it] }
		}

	}

	function depGraph() {
		const inScope = (p) => ['app', 'test'].includes(FILES[p]?.kind) && !isGenerated(p)
		const nodes = new Set()
		for (const [f, i] of Object.entries(F.imports)) {
			if (!inScope(f)) continue
			nodes.add(f)
			for (const t of i.internal) if (inScope(t)) nodes.add(t)
		}
		const deps = (f) => (F.imports[f]?.internal || []).filter((t) => nodes.has(t))
		const layer = {}
		const calc = (f, seen = new Set()) => {
			if (f in layer) return layer[f]
			if (seen.has(f)) return 0
			seen.add(f)
			const ds = deps(f)
			layer[f] = ds.length ? 1 + Math.max(...ds.map((t) => calc(t, seen))) : 0
			return layer[f]
		}
		for (const f of nodes) calc(f)
		const maxL = Math.max(0, ...Object.values(layer))
		const cols = Array.from({ length: maxL + 1 }, (_, k) => [...nodes].filter((f) => layer[f] === k).sort())
		const CW = 236
		const BW = 204
		const BH = 30
		const RH = 40
		const W = cols.length * CW + 20
		const H = Math.max(...cols.map((c) => c.length)) * RH + 50
		const pos = {}
		cols.forEach((c, k) => c.forEach((f, r) => { pos[f] = { x: 14 + k * CW, y: 40 + r * RH } }))
		const heads = ['Foundations', ...Array(Math.max(0, maxL - 1)).fill('Builds on those'), 'Top level'].slice(0, cols.length)
		if (cols.length === 1) heads[0] = 'Files'
		const edges = []
		for (const f of nodes) for (const t of deps(f)) {
			const a = pos[f]
			const b = pos[t]
			const x1 = a.x
			const y1 = a.y + BH / 2
			const x2 = b.x + BW
			const y2 = b.y + BH / 2
			const mid = (x1 + x2) / 2
			edges.push(`<path class="de" data-a="${esc(f)}" data-b="${esc(t)}" d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"/>`)
		}
		const boxes = [...nodes].map((f) => {
			const p = pos[f]
			const k = FILES[f]?.kind || 'app'
			const t = fileInfo(f).title
			const label = t.length > 30 ? `${t.slice(0, 29)}…` : t
			return `<g class="dn" data-f="${esc(f)}" tabindex="0" role="button" aria-label="${esc(t)}" transform="translate(${p.x} ${p.y})"><title>${esc(f)}</title><rect width="${BW}" height="${BH}" rx="7" style="stroke:var(--k-${k});fill:var(--k-${k}-bg)"/><text x="10" y="19">${esc(label)}</text></g>`
		}).join('')
		const headsSvg = cols.map((_, k) => `<text class="colh" x="${14 + k * CW}" y="22">${heads[k]}</text>`).join('')
		return `<svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 900)}px" role="group" aria-label="Which app files use which">${headsSvg}${edges.join('')}${boxes}</svg>`
	}
