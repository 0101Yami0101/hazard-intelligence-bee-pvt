	const fkb = (k) => `<span class="fkb fk fk-${k}">${esc(FN_KIND[k]?.[0] || k)}</span>`
	const fnRef = (id, label) => {
		const s = SYM[id]
		if (!s) return ''
		return `<button type="button" class="ref fref fk fk-${s.kind}" data-open="fn:${esc(id)}" title="${esc(`${s.file}:${s.line}`)}"><span class="dot"></span>${esc(label || fnName(s))}</button>`
	}
	const paramSig = (p) => `${p.rest ? '…' : ''}${p.parts ? `{ ${p.parts.map((x) => x.name).join(', ')} }` : p.name}${p.opt ? '?' : ''}`
	const sigText = (s) => `${fnName(s)}${s.params ? `(${s.params.map(paramSig).join(', ')})` : ''}${s.returns ? ` → ${s.returns}` : ''}`
	const sigHtml = (s) => `<span class="fsig"><b>${esc(fnName(s))}</b>${s.params ? `(${esc(s.params.map(paramSig).join(', '))})` : ''}${s.returns ? ` → ${esc(s.returns)}` : s.declared && !s.params ? `: ${esc(s.declared)}` : ''}</span>`
	function autoSummary(s) {
		const bits = []
		if (s.params?.length) bits.push(`Takes ${s.params.map((p) => `\`${paramSig(p)}\``).join(', ')}.`)
		const fx = [...new Set((s.effects || []).filter((f) => !MINOR.has(f.k)).map((f) => FX[f.k]?.[0].toLowerCase()))]
		if (fx.length) bits.push(`Touches: ${fx.join(', ')}.`)
		const calls = (s.links || []).length
		if (calls) bits.push(`Uses ${calls} other function${calls === 1 ? '' : 's'}.`)
		if (s.returns) bits.push(`Gives back \`${s.returns}\`.`)
		return bits.join(' ') || FN_KIND[s.kind]?.[1] || ''
	}
	/** Every step of a kind inside an outline, however deep. */
	function walkSteps(steps, fn) {
		for (const st of steps || []) {
			fn(st)
			for (const k of ['cc', 'yes', 'no', 'body', 'kids', 'fin']) walkSteps(st[k], fn)
			if (st.catch) walkSteps(st.catch.body, fn)
			for (const c of st.cases || []) walkSteps(c.body, fn)
			for (const c of st.cbs || []) walkSteps(c.body, fn)
		}
	}
	function callOrder(s) {
		const ids = []
		walkSteps(s.outline, (st) => { if (st.id && !ids.includes(st.id)) ids.push(st.id) })
		for (const l of s.links || []) if (!ids.includes(l.id)) ids.push(l.id)
		return ids
	}
	/** The entry points that end up running this function, following callers and config back as far as they go. */
	function reachedFrom(id) {
		const seen = new Set([id])
		const out = []
		let frontier = [id]
		for (let d = 0; d < 12 && frontier.length; d++) {
			const next = []
			for (const f of frontier) {
				for (const u of [...(callersOf[f] || []).map((c) => c.id), ...(wiredBy[f] || []).map((w) => w.from)]) {
					if (seen.has(u)) continue
					seen.add(u)
					if (ENTRY[u]) out.push(u)
					next.push(u)
				}
			}
			frontier = next
		}
		return out
	}

	// Steps, in the order the code runs them.
	const codeTxt = (v) => (v ? ` <code>${esc(v)}</code>` : '')
	const stepsHtml = (steps, chain) => (steps?.length ? `<ol class="ol">${steps.map((s) => stepHtml(s, chain)).join('')}</ol>` : '')
	const branch = (cls, label, steps, chain) => `<div class="br ${cls}"><span class="bl">${label}</span>${steps?.length ? stepsHtml(steps, chain) : '<span class="none">nothing more happens</span>'}</div>`
	const xpBtn = (id, chain) => {
		const t = SYM[id]
		if (!t?.outline?.length) return ''
		if (chain.includes(id)) return '<span class="tag">already open above</span>'
		return `<button type="button" class="xp" data-expand="${esc(id)}" data-chain="${esc([...chain, id].join('|'))}" aria-expanded="false">▸ inside</button><div class="sub" hidden></div>`
	}
	function stepHtml(s, chain) {
		const li = (cls, icon, body, minor) => `<li class="o o-${cls}${minor ? ' minor' : ''}"><span class="ic" aria-hidden="true">${icon}</span><div class="ob">${body}</div></li>`
		const as = s.as ? ` <span class="tag" title="Keeps the result as">→ ${esc(s.as)}</span>` : ''
		const wait = s.await ? ' <span class="tag" title="Waits for it to finish">waits</span>' : ''
		const cbs = (s.cbs || []).map((c) => branch('', `with an inline function (${esc(c.label)})`, c.body, chain)).join('')
		const raw = s.v ? `<span class="L-detail">${codeTxt(s.v)}</span>` : ''
		switch (s.t) {
			case 'call':
				if (s.param) return li('call', '→', `<span class="lbl">Calls the function it was given,</span> <code>${esc(s.param)}</code>${as}${wait}${raw}${cbs}`)
				return li('call', s.new ? '+' : '→', `<span class="lbl">${s.new ? 'Creates' : 'Calls'}</span> ${fnRef(s.id)}${s.via ? ` <span class="tag">its ${esc(s.via)}</span>` : ''}${as}${wait}${raw}${xpBtn(s.id, chain)}${cbs}`)
			case 'render':
				return li('render', '▭', `<span class="lbl">Shows</span> ${fnRef(s.id)}${xpBtn(s.id, chain)}${s.kids?.length ? branch('', 'and inside it', s.kids, chain) : ''}`)
			case 'use':
				return li('use', '⇢', `<span class="lbl">Hands over</span> ${fnRef(s.id)} <span class="tag">as ${esc(s.v)}</span>`)
			case 'fx': {
				const f = FX[s.k] || FX.lib
				const stop = s.k === 'redirect' || s.k === 'notfound' || s.k === 'exit'
				return li(stop ? 'exit' : 'fx', f[1], `<span class="lbl">${f[2](s)}</span>${as}${wait}${raw}${cbs}`, MINOR.has(s.k))
			}
			case 'if': {
				const head = s.missing ? `If <code>${esc(s.c)}</code> is missing` : s.unless ? `Unless <code>${esc(s.c)}</code>` : `If <code>${esc(s.c)}</code>`
				const cc = s.cc?.length ? `<div class="br"><span class="bl">to decide, it</span>${stepsHtml(s.cc, chain)}</div>` : ''
				return li('if', '◆', `<span class="lbl">${head}</span>${cc}${branch('br-yes', s.unless ? 'otherwise' : 'yes', s.yes, chain)}${s.no ? branch('br-no', 'otherwise', s.no, chain) : ''}`)
			}
			case 'switch':
				return li('switch', '◇', `<span class="lbl">Depending on</span> <code>${esc(s.c)}</code>${s.cases.map((c) => branch('', `when ${esc(c.c)}`, c.body, chain)).join('')}`)
			case 'loop': {
				const head = s.w === 'each' ? `For each <code>${esc(s.c)}</code>` : s.c ? `While <code>${esc(s.c)}</code>` : 'Repeats until it’s told to stop'
				return li('loop', '↻', `<span class="lbl">${head}</span>${s.cc?.length ? `<div class="br"><span class="bl">to decide, it</span>${stepsHtml(s.cc, chain)}</div>` : ''}${branch('', 'each time', s.body, chain)}`)
			}
			case 'try':
				return li('try', '⚐', `<span class="lbl">Tries</span>${branch('', 'this', s.body, chain)}${s.catch ? branch('br-no', `if anything in it fails${s.catch.v ? ` (the error is <code>${esc(s.catch.v)}</code>)` : ''}`, s.catch.body, chain) : ''}${s.fin ? branch('', 'and always, at the end', s.fin, chain) : ''}`)
			case 'ret':
				if (s.gen) return li('ret', '↩', `<span class="lbl">Hands out, one at a time,</span>${s.v ? codeTxt(s.v) : ' nothing'}<span class="small muted"> and carries on when asked for the next</span>`)
				return li('ret', '↩', s.jsx ? '<span class="lbl">Gives back the page markup</span>' : `<span class="lbl">Gives back</span>${s.v ? codeTxt(s.v) : ' nothing, and stops'}`)
			case 'throw':
				return li('throw', '✕', `<span class="lbl">Stops with an error</span>${codeTxt(s.v)}`)
			case 'jump':
				return li('ret', '⤼', `<span class="lbl">${s.v === 'break' ? 'Leaves the loop' : 'Skips to the next one'}</span>`)
			case 'cb':
				return li('call', 'ƒ', `<span class="lbl">Inside</span> <code>${esc(s.label)}</code>${stepsHtml(s.body, chain)}`)
			case 'more':
				return li('fx', '…', '<span class="lbl muted">More steps, cut short here. Read the code below.</span>')
			default:
				return ''
		}
	}
	function toggleExpand(b) {
		const sub = b.nextElementSibling
		if (!sub?.classList.contains('sub')) return
		const open = b.getAttribute('aria-expanded') !== 'true'
		b.setAttribute('aria-expanded', String(open))
		b.textContent = open ? '▾ inside' : '▸ inside'
		if (open && !sub.dataset.done) {
			const t = SYM[b.dataset.expand]
			sub.innerHTML = `${sigHtml(t)}${stepsHtml(t.outline, b.dataset.chain.split('|'))}`
			sub.dataset.done = '1'
		}
		sub.hidden = !open
	}

	// The code itself, lightly coloured.
	const SRC = {}
	const TOK = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`(?:\\[\s\S]|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|of|in|while|do|await|async|export|import|from|default|try|catch|finally|throw|new|switch|case|break|continue|type|interface|typeof|as|satisfies|null|undefined|true|false)\b/g
	// Python: # comments, triple-quoted and prefixed strings (f"", r'', b""), its own keywords.
	const TOK_PY = /(#[^\n]*)|((?:\b[rRbBuUfF]{1,2})?(?:"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'))|\b(def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|with|try|except|finally|raise|lambda|yield|async|await|pass|break|continue|global|nonlocal|del|assert|match|case|None|True|False|self)\b/g
	function hlCode(t, file = '') {
		let out = ''
		let last = 0
		for (const m of t.matchAll(/\.pyi?$/.test(file) ? TOK_PY : TOK)) {
			out += esc(t.slice(last, m.index))
			out += m[1] ? `<span class="c">${esc(m[1])}</span>` : m[2] ? `<span class="s">${esc(m[2])}</span>` : `<span class="k">${m[3]}</span>`
			last = m.index + m[0].length
		}
		return out + esc(t.slice(last))
	}
	function sourceHtml(s) {
		const lines = (SRC[s.file] ||= (CODE.sources[s.file] || '').split('\n')).slice(s.line - 1, Math.min(s.end, s.line + 399))
		if (!lines.length) return '<p class="small muted">No source for this one.</p>'
		return `<div class="src"><pre class="gut">${lines.map((_, i) => s.line + i).join('\n')}</pre><pre>${hlCode(lines.join('\n'), s.file)}</pre></div>`
	}

	// Who calls it (left) and what it calls (right), a few steps each way.
	function callGraph(id, out, inn) {
		const col = new Map([[id, 0]])
		const cols = { 0: [id] }
		const more = {}
		const edges = []
		const MAXC = 16
		const place = (n, d) => {
			if (col.has(n)) return col.get(n) === d
			if ((cols[d] ||= []).length >= MAXC) { more[d] = (more[d] || 0) + 1; return false }
			col.set(n, d)
			cols[d].push(n)
			return 'new'
		}
		let frontier = [id]
		for (let d = 1; d <= out; d++) {
			const next = []
			for (const f of frontier) for (const t of callOrder(SYM[f])) {
				if (!SYM[t]) continue
				const r = place(t, d)
				if (r === 'new') next.push(t)
				if (r) edges.push({ a: f, b: t, how: (SYM[f].links || []).find((l) => l.id === t)?.how || 'call' })
			}
			frontier = next
		}
		frontier = [id]
		for (let d = 1; d <= inn; d++) {
			const next = []
			for (const f of frontier) {
				for (const u of [...(callersOf[f] || []), ...(wiredBy[f] || []).map((w) => ({ id: w.from, how: 'wire', at: w.at }))]) {
					const r = place(u.id, -d)
					if (r === 'new') next.push(u.id)
					if (r && !edges.some((e) => e.a === u.id && e.b === f)) edges.push({ a: u.id, b: f, how: u.how, at: u.at })
				}
			}
			frontier = next
		}
		const keys = Object.keys(cols).map(Number).filter((k) => cols[k].length).sort((a, b) => a - b)
		const CW = 252
		const BW = 216
		const BH = 42
		const RH = 52
		const TOP = 30
		const rows = (k) => cols[k].length + (more[k] ? 1 : 0)
		const H = Math.max(...keys.map(rows)) * RH + TOP + 6
		const W = keys.length * CW - (CW - BW) + 16
		const pos = {}
		keys.forEach((k, i) => {
			const off = (H - TOP - rows(k) * RH) / 2
			cols[k].forEach((n, r) => { pos[n] = { x: 8 + i * CW, y: TOP + off + r * RH } })
		})
		const heads = keys.map((k, i) => `<text class="colh" x="${8 + i * CW}" y="16">${k < 0 ? `Called by${k < -1 ? ` (${-k} up)` : ''}` : k === 0 ? 'This one' : `Calls${k > 1 ? ` (${k} down)` : ''}`}</text>${more[k] ? `<text class="gt" x="${8 + i * CW}" y="${H - 8}">+${more[k]} more</text>` : ''}`)
		const paths = edges.filter((e) => pos[e.a] && pos[e.b]).map((e) => {
			const a = pos[e.a]
			const b = pos[e.b]
			const x1 = a.x + BW
			const y1 = a.y + BH / 2
			const x2 = b.x
			const y2 = b.y + BH / 2
			const mid = (x1 + x2) / 2
			return `<path class="ge ${e.how}" data-a="${esc(e.a)}" data-b="${esc(e.b)}" d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}"><title>${esc(`${fnName(SYM[e.a])} ${e.how === 'wire' ? `hooks it up at ${e.at}` : e.how === 'render' ? 'shows' : e.how === 'use' ? 'hands over' : 'calls'} ${fnName(SYM[e.b])}`)}</title></path>`
		})
		const boxes = Object.entries(pos).map(([n, p]) => {
			const s = SYM[n]
			const fx = [...new Set((s.effects || []).map((f) => FX_SHORT[f.k]).filter(Boolean))]
			const sub = `${FN_KIND[s.kind]?.[0] || s.kind}${ENTRY[n] ? ' · entry' : ''}${fx.length ? ` · ${fx.join(', ')}` : ''}`
			return `<g class="gn fk fk-${s.kind}${n === id ? ' focus' : ''}" data-g="${esc(n)}" tabindex="0" role="button" aria-label="${esc(fnName(s))}" transform="translate(${p.x} ${p.y})"><title>${esc(`${sigText(s)}\n${s.file}:${s.line}`)}</title><rect width="${BW}" height="${BH}" rx="8"/><text x="10" y="17">${esc(fit(fnName(s), 31))}</text><text class="gk" x="10" y="33">${esc(fit(sub, 38))}</text></g>`
		})
		return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="Who calls ${esc(fnName(SYM[id]))} and what it calls">${heads.join('')}${paths.join('')}${boxes.join('')}</svg>`
	}

	let fnFocus = store.get('fnFocus')
	if (!SYM[fnFocus]) fnFocus = (CODE.entries.find((e) => e.kind === 'page' && e.trigger === '/') || CODE.entries.find((e) => e.kind === 'page') || CODE.entries[0])?.id || CODE.symbols.find((s) => s.params)?.id
	const fnBack = []
	let gIn = Math.min(3, Math.max(0, +(store.get('gIn') ?? 1)))
	let gOut = Math.min(4, Math.max(1, +(store.get('gOut') ?? 2)))
	function focusFn(id, { push = true } = {}) {
		if (!SYM[id]) return
		if (push && fnFocus && fnFocus !== id) fnBack.push(fnFocus)
		fnFocus = id
		store.set('fnFocus', id)
		drawExplorer()
	}
	function drawExplorer() {
		const el = $('#fx-explore')
		if (!el) return
		const s = SYM[fnFocus]
		if (!s) { el.innerHTML = '<p class="muted">Pick a function above.</p>'; return }
		const e = ENTRY[s.id]
		el.innerHTML = `<div class="fhead">
				<div class="row">${fkb(s.kind)}${e ? `<span class="small">Starts on: <b class="mono">${esc(fit(e.trigger, 120))}</b></span>` : ''}</div>
				<h3>${esc(fnName(s))}</h3>
				<span class="small muted mono">${esc(s.file)}:${s.line}–${s.end}</span>
				<div>${sigHtml(s)}</div>
				<div class="tx fdoc">${s.doc ? mdBlock(s.doc) : `<p>${md(autoSummary(s))}</p>`}</div>
				<div class="row"><button type="button" class="btn" data-open="fn:${esc(s.id)}">Full details</button>${fnBack.length ? '<button type="button" class="btn" id="fx-back">← Back</button>' : ''}</div>
			</div>
			<div class="card scroll-x fg" id="fx-graph" style="padding:8px">${callGraph(s.id, gOut, gIn)}</div>
			<div class="sect" style="margin-top:18px">
				<h3>What it does, step by step</h3>
				<p class="lead tx">In the order the code runs. ◆ is a decision, → a call to our own code, ⛁ and ✉ touch the outside world, ↩ gives a result back, ✕ stops with an error. Press <b>▸ inside</b> to open a call in place; Detailed and Technical depth also show each line of code.</p>
				<div class="xbar"><button type="button" class="btn" id="fx-openall">Open every call, 3 levels deep</button><button type="button" class="btn" id="fx-closeall">Close them</button><button type="button" class="btn" id="fx-code" aria-pressed="false">Show the code</button><label><input type="checkbox" id="fx-minor"> Show small steps (setup, screen drawing, library calls, logs)</label></div>
				<div class="hide-minor" id="fx-steps">${s.outline?.length ? stepsHtml(s.outline, [s.id]) : `<p class="small muted">${s.kind === 'type' ? 'A type has no steps: it only describes the shape of data.' : 'No steps worth showing: it only holds a value.'}</p>`}</div>
				<div id="fx-src" hidden style="margin-top:12px">${sourceHtml(s)}</div>
			</div>`
		$('#fx-back', el)?.addEventListener('click', () => { const prev = fnBack.pop(); if (prev) focusFn(prev, { push: false }) })
		$('#fx-openall', el).addEventListener('click', () => {
			let n = 0
			for (let level = 0; level < 3; level++) for (const b of $$('#fx-steps [data-expand][aria-expanded="false"]', el)) { if (n++ > 300) return; toggleExpand(b) }
		})
		$('#fx-closeall', el).addEventListener('click', () => { for (const b of $$('#fx-steps > .ol > .o [data-expand][aria-expanded="true"]', el)) toggleExpand(b) })
		$('#fx-code', el).addEventListener('click', (ev) => { const on = ev.currentTarget.getAttribute('aria-pressed') !== 'true'; ev.currentTarget.setAttribute('aria-pressed', String(on)); ev.currentTarget.textContent = on ? 'Hide the code' : 'Show the code'; $('#fx-src', el).hidden = !on })
		$('#fx-minor', el).addEventListener('change', (ev) => $('#fx-steps', el).classList.toggle('hide-minor', !ev.target.checked))
		const g = $('#fx-graph', el)
		const svg = $('svg', g)
		svg.addEventListener('click', (ev) => { const n = ev.target.closest('.gn'); if (n && n.dataset.g !== fnFocus) focusFn(n.dataset.g) })
		svg.addEventListener('keydown', (ev) => { const n = ev.target.closest('.gn'); if (n && ev.key === 'Enter') focusFn(n.dataset.g) })
		svg.addEventListener('mouseover', (ev) => {
			const n = ev.target.closest('.gn')
			if (!n) return
			g.classList.add('focusing')
			const id = n.dataset.g
			const ps = $$('.ge', svg).filter((p) => p.dataset.a === id || p.dataset.b === id)
			const ids = new Set([id, ...ps.flatMap((p) => [p.dataset.a, p.dataset.b])])
			for (const x of $$('.gn', svg)) x.classList.toggle('hl', ids.has(x.dataset.g))
			for (const p of $$('.ge', svg)) p.classList.toggle('hl', ps.includes(p))
		})
		svg.addEventListener('mouseout', (ev) => { const n = ev.target.closest('.gn'); if (n && !n.contains(ev.relatedTarget)) { g.classList.remove('focusing'); for (const x of $$('.hl', svg)) x.classList.remove('hl') } })
		const mid = $('.gn.focus', svg)
		if (mid && g.scrollWidth > g.clientWidth) g.scrollLeft = Math.max(0, +mid.getAttribute('transform').match(/[\d.]+/)[0] - g.clientWidth / 2 + 108)
	}

	const inFnFilter = (s, f) => f === 'all' || (f === 'entry' ? Boolean(ENTRY[s.id]) : f === 'hook' ? ['hook', 'access', 'validate'].includes(s.kind) : f === 'config' ? ['collection', 'global', 'field', 'object', 'value'].includes(s.kind) : f === 'function' ? ['function', 'method', 'class', 'module'].includes(s.kind) : s.kind === f)
	// Only the filters this code has: a Python project has no components or Payload hooks.
	const FN_FILTERS = [['all', 'Everything'], ['entry', 'Entry points'], ['component', 'Components'], ['function', 'Functions'], ['hook', 'Hooks & rules'], ['type', 'Types'], ['config', 'Config & values']].filter(([k]) => k === 'all' || CODE.symbols.some((s) => inFnFilter(s, k)))
	const LANGS = new Set((CODE.projects || []).map((p) => p.lang || 'ts'))
	const IS_PY = (f) => /\.pyi?$/.test(f || '')
	const fnCallable = CODE.symbols.filter((s) => s.params && s.kind !== 'type')

	RENDER.functions = (el) => {
		const total = (f) => CODE.symbols.reduce((n, s) => n + f(s), 0)
		const decisions = total((s) => s.decisions || 0)
		const dbCalls = total((s) => (s.effects || []).filter((f) => f.k.startsWith('db-')).length)
		const fileCalls = total((s) => (s.effects || []).filter((f) => f.k.startsWith('file-')).length)
		const netCalls = total((s) => (s.effects || []).filter((f) => f.k === 'network').length)
		const tested = fnCallable.filter((s) => CODE.tests[s.id]).length
		const components = CODE.symbols.filter((s) => s.kind === 'component').length
		const methods = CODE.symbols.filter((s) => s.kind === 'method').length
		// The busiest kind of outside call: a web app talks to its database, a data pipeline to files.
		const outsideTile = dbCalls || (!fileCalls && !netCalls) ? [dbCalls, 'Database calls', 'reads and writes', 'fx-outside'] : fileCalls >= netCalls ? [fileCalls, 'File reads & writes', `${netCalls} network calls too`, 'fx-outside'] : [netCalls, 'Network calls', `${fileCalls} file reads & writes too`, 'fx-outside']
		const tiles = [
			[fnCallable.length, 'Functions', components ? `${components} of them components` : `${methods} of them methods`, 'fx-list'],
			[CODE.entries.length, 'Entry points', 'where the code starts', 'fx-start'],
			[decisions, 'Decisions', 'ifs, matches, loops, catches', 'fx-follow'],
			outsideTile,
			[tested, 'Have tests', `${fnCallable.length ? Math.round((tested / fnCallable.length) * 100) : 0}% of functions`, 'fx-health'],
			[CODE.symbols.filter((s) => s.kind === 'type').length, 'Types', 'shapes of data', 'fx-list'],
		]
		const groups = ENTRY_GROUPS.map(([title, kinds, lead]) => {
			const list = CODE.entries.filter((e) => kinds.includes(e.kind)).sort((a, b) => a.trigger.localeCompare(b.trigger) || kinds.indexOf(a.kind) - kinds.indexOf(b.kind))
			if (!list.length) return ''
			return `<div class="egroup"><h4>${title} <span class="muted small">${list.length}</span></h4><p class="tx">${md(lead)}</p><div class="ecards">${list.map((e) => {
				const s = SYM[e.id]
				const places = e.trigger.split('; ')
				const trig = places.length > 2 ? `${places.slice(0, 2).join('; ')} +${places.length - 2} more` : e.trigger
				const from = e.kind === 'action' ? (callersOf[e.id] || []).map((c) => fnName(SYM[c.id])) : []
				return `<button type="button" class="ecard fk fk-${s.kind}" data-follow="${esc(e.id)}" title="${esc(e.trigger)}"><span class="et">${esc(trig)}</span><b>${esc(fnName(s))}</b><small>${from.length ? `from ${esc(from.join(', '))}` : esc(`${shortPath(s.file)}${s.kind === 'meta' ? ' · page info' : s.kind === 'layout' ? ' · layout' : ''}`)}</small></button>`
			}).join('')}</div></div>`
		}).join('')

		const byFile = new Map()
		for (const s of CODE.symbols) { if (!byFile.has(s.file)) byFile.set(s.file, []); byFile.get(s.file).push(s) }
		const index = [...byFile.entries()].map(([file, list]) => `<details class="fold" data-file="${esc(file)}"><summary><b>${esc(shortPath(file))}</b><span class="small muted">${list.length}</span></summary><div class="flist">${list.map((s) => `<button type="button" class="frow fnrow" data-open="fn:${esc(s.id)}" data-k="${s.kind}" data-text="${esc(`${fnName(s)} ${s.doc || ''} ${file}`.toLowerCase())}"><span class="fn-n">${fkb(s.kind)}${sigHtml(s)}</span><span class="d tx">${mdp(firstSentence(s.doc) || autoSummary(s))}</span><span class="m">${(callersOf[s.id] || []).length + (wiredBy[s.id] || []).length} in · ${(s.links || []).length} out · ln ${s.line}</span></button>`).join('')}</div></details>`).join('')

		const db = {}
		const other = {}
		const filesTouched = {}
		for (const s of CODE.symbols) for (const f of s.effects || []) {
			if (f.k === 'db-read' || f.k === 'db-write') { const t = (db[f.on || 'other'] ||= { r: new Set(), w: new Set() }); (f.k === 'db-read' ? t.r : t.w).add(s.id) }
			else if (f.k === 'file-read' || f.k === 'file-write') { const t = (filesTouched[f.on || '(a path worked out at run time)'] ||= { r: new Set(), w: new Set() }); (f.k === 'file-read' ? t.r : t.w).add(s.id) }
			else if (!MINOR.has(f.k) && !['validate', 'response', 'request'].includes(f.k)) (other[f.k] ||= new Set()).add(s.id)
		}
		// Many files have a main(): name each function with its file.
		const fileFnRef = (id) => fnRef(id, `${base(SYM[id].file).replace(/\.[^.]+$/, '')} › ${fnName(SYM[id])}`)
		// Files named the same way in many places (`OUT / "x.json"`) group together; the busiest come first.
		const fileRows = Object.entries(filesTouched).sort(([a, x], [b, y]) => y.r.size + y.w.size - (x.r.size + x.w.size) || a.localeCompare(b)).slice(0, 80).map(([on, t]) => `<tr><td class="mono small" style="overflow-wrap:anywhere;min-width:220px">${esc(on)}</td><td>${[...t.r].map(fileFnRef).join('') || '<span class="muted small">—</span>'}</td><td>${[...t.w].map(fileFnRef).join('') || '<span class="muted small">—</span>'}</td></tr>`).join('')
		const fileCount = Object.keys(filesTouched).length

		const fnRefs = (set) => `<div class="refs">${[...set].map((id) => fnRef(id)).join('') || '<span class="muted small">—</span>'}</div>`
		const dbRows = Object.entries(db).sort(([a], [b]) => a.localeCompare(b)).map(([on, t]) => `<tr><td class="mono small">${ENT[on] ? `<button type="button" class="ref" data-open="entity:${esc(on)}"><span class="mono">${esc(on)}</span></button>` : esc(on)}</td><td>${fnRefs(t.r)}</td><td>${fnRefs(t.w)}</td></tr>`).join('')
		const otherRows = Object.entries(other).sort(([a], [b]) => (FX[a]?.[0] || a).localeCompare(FX[b]?.[0] || b)).map(([k, set]) => `<tr><td class="small" style="white-space:nowrap">${FX[k]?.[1] || ''} ${esc(FX[k]?.[0] || k)}</td><td>${fnRefs(set)}</td></tr>`).join('')

		const unused = fnCallable.filter((s) => !ENTRY[s.id] && !callersOf[s.id]?.length && !wiredBy[s.id]?.length)
		const top = (list, key, n = 12) => [...list].sort((a, b) => key(b) - key(a) || fnName(a).localeCompare(fnName(b))).slice(0, n)
		const hlist = (list, label) => `<ul class="hlist">${list.map((s) => `<li>${fnRef(s.id)}<span class="n">${label(s)}</span></li>`).join('') || '<li class="muted">None.</li>'}</ul>`
		const used = (s) => (callersOf[s.id] || []).length + (wiredBy[s.id] || []).length

		const missing = [].concat(CODE.missing || [])
		const MISSING_TEXT = {
			typescript: 'The JavaScript/TypeScript is read with the project’s own TypeScript compiler, which wasn’t found when the map was built. Install the project’s dependencies (or add <code>typescript</code> as a dev dependency) and run the map scanner again.',
			python: 'The Python is read with Python’s own parser, but no Python 3.8 or newer was found when the map was built. Install Python, or set <code>python.interpreter</code> in <code>map.config.mjs</code>, and run the map scanner again.',
		}
		if (missing.length && !CODE.symbols.length) {
			el.innerHTML = vhead('The code, function by function', missing.map((m) => MISSING_TEXT[m] || '').join(' '))
			return
		}
		const readBy = LANGS.has('python') && LANGS.has('ts') ? 'read by the TypeScript compiler and Python’s own parser' : LANGS.has('python') ? 'read by Python’s own parser' : 'read by the TypeScript compiler'
		const what = LANGS.has('ts') ? 'Every function, component, type and config object' : 'Every function, class, method and module-level setting'
		const where = CODE.projects.length > 1 ? `${CODE.projects.length} projects (${CODE.projects.map((p) => (p.lang === 'python' ? 'the Python code' : `<code>${esc(p.root || '.')}</code>`)).join(', ')})` : 'the code'
		el.innerHTML = `${vhead('The code, function by function', `${what} in ${where}, ${readBy}: what each one takes, what it gives back, what it calls, every decision it makes and what it touches outside the app. Start from an entry point and follow the code down, or search for any function. Migrations and generated files aren’t included.${missing.length ? ` <span class="muted">${missing.map((m) => MISSING_TEXT[m] || '').join(' ')}</span>` : ''}`)}
		<div class="tiles">${tiles.map(([n, l, sub, go]) => `<button type="button" class="tile" data-jump="${go}"><span class="n">${n}</span><span class="l">${l}</span><span class="s">${sub}</span></button>`).join('')}</div>
		<div class="sect" id="fx-start">
			<h3>Where things start</h3>
			<p class="lead tx">Nothing runs until something starts it. These are all the ways in: an address opened, a form sent, a command typed, a timer, a hook, the server starting. Click one to follow its code below.</p>
			<div class="egroups">${groups}</div>
		</div>
		<div class="sect" id="fx-follow">
			<h3>Follow the code</h3>
			<p class="lead tx">Pick any function. The graph shows who calls it on the left and what it calls on the right; click a box to move there. Dotted lines mean “shows this component”, dashed ones “hands this over” or “hooks it up in a config”.</p>
			<div class="xbar">
				<div class="fpick"><input type="search" id="fx-q" placeholder="Find a function, component or type…" autocomplete="off" aria-label="Find a function to follow" aria-controls="fx-res"><div class="results" id="fx-res" hidden></div></div>
				<label>Callers <select id="fx-in">${[0, 1, 2, 3].map((n) => `<option value="${n}"${n === gIn ? ' selected' : ''}>${n} step${n === 1 ? '' : 's'} up</option>`).join('')}</select></label>
				<label>Calls <select id="fx-out">${[1, 2, 3, 4].map((n) => `<option value="${n}"${n === gOut ? ' selected' : ''}>${n} step${n === 1 ? '' : 's'} down</option>`).join('')}</select></label>
			</div>
			<div class="card" id="fx-explore"></div>
		</div>
		<div class="sect" id="fx-list">
			<h3>Every function</h3>
			<p class="lead tx">${CODE.symbols.length} in all, grouped by file. “in” counts what calls or hooks it up, “out” what it uses. Click one for its full details.</p>
			<div class="xbar"><input type="search" id="fx-filter" placeholder="Filter by name or words" aria-label="Filter functions"><div class="filters" id="fx-kinds">${FN_FILTERS.map(([k, l], i) => `<button type="button" data-f="${k}" aria-pressed="${i === 0}">${l}</button>`).join('')}</div></div>
			<div id="fx-index">${index}</div>
		</div>
		<div class="sect" id="fx-outside">
			<h3>What touches the outside</h3>
			<p class="lead tx">Which functions read or change ${dbRows ? 'each collection' : fileRows ? 'each file' : 'stored data'}, and which send email, call other servers, run other programs, redirect or clear the cache. Only the function that makes the call is listed: open it to see who calls it.</p>
			<div class="two">
				${dbRows || !fileRows ? `<div class="card scroll-x" style="padding:4px"><table class="t fxtable"><thead><tr><th>Collection or global</th><th>Read by</th><th>Changed by</th></tr></thead><tbody>${dbRows}</tbody></table></div>` : ''}
				<div class="card scroll-x" style="padding:4px"><table class="t fxtable"><thead><tr><th>Does</th><th>Done by</th></tr></thead><tbody>${otherRows}</tbody></table></div>
			</div>
			${fileRows ? `<h4 style="margin:18px 0 6px">Files <span class="muted small">${fileCount}${fileCount > 80 ? ', the 80 busiest shown' : ''}</span></h4><p class="small muted" style="margin-bottom:8px">Each path as the code writes it, so a name built from a setting (<code>OUT / "x.json"</code>) shows that way.</p><div class="card scroll-x" style="padding:4px"><table class="t fxtable"><thead><tr><th>File or path</th><th>Read by</th><th>Written by</th></tr></thead><tbody>${fileRows}</tbody></table></div>` : ''}
		</div>
		<div class="sect" id="fx-health">
			<h3>Worth a look</h3>
			<p class="lead tx">Functions nothing in the app calls (left over, or used only by tests), the ones most code depends on (change them with care), and the ones with the most decisions (the trickiest to follow).</p>
			<div class="three">
				<div class="card"><h4 style="margin-bottom:8px">Not called from anywhere <span class="muted small">${unused.length}</span></h4>${hlist(unused, (s) => (CODE.tests[s.id] ? 'tests only' : 'unused'))}</div>
				<div class="card"><h4 style="margin-bottom:8px">Most used</h4>${hlist(top(fnCallable.filter(used), used), (s) => `${used(s)} callers`)}</div>
				<div class="card"><h4 style="margin-bottom:8px">Most decisions</h4>${hlist(top(fnCallable.filter((s) => s.decisions), (s) => s.decisions), (s) => `${s.decisions} decisions`)}</div>
			</div>
		</div>`

		el.addEventListener('click', (ev) => { const t = ev.target.closest('[data-jump]'); if (t) $(`#${t.dataset.jump}`, el)?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' }) })
		for (const [sel, key] of [['#fx-in', 'gIn'], ['#fx-out', 'gOut']]) $(sel, el).addEventListener('change', (ev) => { const v = +ev.target.value; if (key === 'gIn') gIn = v; else gOut = v; store.set(key, v); drawExplorer() })
		// The picker: same scoring as the main search, functions only.
		const q = $('#fx-q', el)
		const res = $('#fx-res', el)
		let picks = []
		const find = () => {
			const t = q.value.trim().toLowerCase()
			if (!t) { res.hidden = true; return }
			picks = CODE.symbols.map((s) => {
				const n = fnName(s).toLowerCase()
				const score = n === t ? 100 : n.startsWith(t) ? 60 : n.includes(t) ? 40 : `${s.doc || ''} ${s.file}`.toLowerCase().includes(t) ? 10 : 0
				return score ? { s, score } : null
			}).filter(Boolean).sort((a, b) => b.score - a.score || fnName(a.s).localeCompare(fnName(b.s))).slice(0, 12)
			res.innerHTML = picks.length ? picks.map(({ s }, k) => `<button type="button" data-pick="${k}"><span class="k">${esc(FN_KIND[s.kind]?.[0] || '')}</span><span class="t"><b>${esc(fnName(s))}</b><small>${esc(shortPath(s.file))}:${s.line}</small></span></button>`).join('') : '<p class="none">No function by that name.</p>'
			res.hidden = false
		}
		q.addEventListener('input', find)
		q.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && picks[0]) { res.hidden = true; focusFn(picks[0].s.id) } if (ev.key === 'Escape') res.hidden = true })
		res.addEventListener('click', (ev) => { const b = ev.target.closest('[data-pick]'); if (b) { res.hidden = true; q.value = ''; focusFn(picks[+b.dataset.pick].s.id) } })
		document.addEventListener('click', (ev) => { if (!ev.target.closest('.fpick')) res.hidden = true })
		// The index filter: words and kind together.
		let kind = 'all'
		const applyFilter = () => {
			const t = $('#fx-filter', el).value.trim().toLowerCase()
			const words = t.split(/\s+/).filter(Boolean)
			for (const d of $$('#fx-index details', el)) {
				let any = false
				for (const r of $$('.frow', d)) {
					const ok = inFnFilter(SYM[r.dataset.open.slice(3)], kind) && words.every((w) => r.dataset.text.includes(w))
					r.hidden = !ok
					any ||= ok
				}
				d.hidden = !any
				d.open = any && (words.length > 0 || kind !== 'all')
			}
		}
		$('#fx-filter', el).addEventListener('input', applyFilter)
		$('#fx-kinds', el).addEventListener('click', (ev) => {
			const b = ev.target.closest('[data-f]')
			if (!b) return
			kind = b.dataset.f
			for (const x of $$('#fx-kinds button', el)) x.setAttribute('aria-pressed', String(x === b))
			applyFilter()
		})
		drawExplorer()
	}

	// ---------- data
	RENDER.data = (el) => {
		const ents = Object.values(ENT)
		const BW = 190
		const BH = 46
		const laid = Object.values(C.dataLayout)
		const baseY = laid.length ? Math.max(...laid.map((q) => q[1])) + 80 : 60
		let auto = 0
		const pos = {}
		for (const e of ents) {
			const p = C.dataLayout[e.slug]
			pos[e.slug] = p ? { x: p[0], y: p[1] } : { x: 110 + (auto % 4) * 260, y: baseY + Math.floor(auto++ / 4) * 80 }
		}
		const H = Math.max(240, ...Object.values(pos).map((p) => p.y + 50))
		const rels = C.relations.filter((r) => pos[r.from] && pos[r.to])
		const cl = (a, b) => {
			const dx = b.x - a.x
			const dy = b.y - a.y
			const t = Math.min(dx ? (BW / 2 + 3) / Math.abs(dx) : Infinity, dy ? (BH / 2 + 3) / Math.abs(dy) : Infinity)
			return [a.x + dx * t, a.y + dy * t]
		}
		const relSvg = rels.map((r, i) => {
			const a = pos[r.from]
			const b = pos[r.to]
			const [x1, y1] = cl(a, b)
			const [x2, y2] = cl(b, a)
			return `<line class="rel" data-r="${i}" data-a="${esc(r.from)}" data-b="${esc(r.to)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><title>${esc(`${r.from} → ${r.to}: ${r.label || ''}${r.many ? ' (many)' : ''}`)}</title></line>${r.many ? `<circle class="many" data-a="${esc(r.from)}" data-b="${esc(r.to)}" cx="${x2}" cy="${y2}" r="3.5"/>` : ''}`
		}).join('')
		const entSvg = ents.map((e) => {
			const p = pos[e.slug]
			const plural = e.tables.length === 1 ? '' : 's'
			const ms = MS[msIdx[e.milestone]]
			const sub = e.slug === OTHER ? `${e.tables.length} tables` : e.status === 'built' ? `Built${e.tables.length ? ` · ${e.tables.length} table${plural}` : ''}` : `${STATUS[e.status] || 'Planned'}${ms ? ` · ${ms.name}` : ''}`
			return `<g class="ent s-${e.status}" data-ent="${esc(e.slug)}" tabindex="0" role="button" aria-label="${esc(e.slug)}, ${STATUS[e.status] || ''}" transform="translate(${p.x - BW / 2} ${p.y - BH / 2})"><rect width="${BW}" height="${BH}" rx="8"/><text class="en" x="12" y="19">${esc(fit(e.slug, 26))}</text><text class="es" x="12" y="36">${esc(fit(sub, 30))}</text></g>`
		}).join('')
		const groupsSvg = C.dataGroups.map(([t, x]) => `<text class="grp" x="${x}" y="22" text-anchor="middle">${esc(t)}</text>`).join('')
		const src = F.schema.source
		el.innerHTML = `${vhead('The data', `What the system stores and how the pieces link.${src ? ` Real tables are read from <code>${esc(src)}</code>.` : ''}${ents.length ? ' Solid boxes exist in the database today; dashed ones are designed but not built yet.' : ''}`)}
		${ents.length ? `<div class="card mapcard">
			<div class="maptools"><span class="small muted">Click a box for its fields. Hover to see its links; a dot marks the “many” end.</span><div class="legend"><span><i class="sw sw-built"></i>In the database</span><span><i class="sw sw-planned"></i>Designed, not built</span></div></div>
			<div class="svgbox er" id="er"><svg viewBox="0 0 1000 ${H}" role="group" aria-label="Data diagram"><rect class="bg" width="1000" height="${H}" style="fill:var(--sheet)"/>${groupsSvg}${relSvg}${entSvg}</svg></div>
		</div>` : ''}
		${F.schema.tables.length ? `<div class="sect"${ents.length ? '' : ' style="margin-top:0"'}>
			<h3>Tables in the database today</h3>
			<p class="lead tx">${F.schema.tables.length} tables${F.schema.migrations.length ? `, from ${F.schema.migrations.length} schema or migration file${F.schema.migrations.length === 1 ? '' : 's'}` : ''}. Click one to see every column explained.</p>
			<div class="grid cols-auto">${F.schema.tables.map((t) => `<button type="button" class="card partrow" style="border:1px solid var(--rule);padding:12px" data-open="table:${esc(t.name)}"><b class="mono">${esc(t.name)}</b><span class="kind">${t.columns.length} columns</span><p class="tx">${mdp(C.tables[t.name]?.simple || '')}</p></button>`).join('')}</div>
		</div>` : ''}
		${C.dataNotes.length ? `<div class="sect two">${C.dataNotes.map((n) => `<div><h3>${esc(n.title)}</h3><div class="tx small" style="display:grid;gap:6px;margin-top:8px">${mdBlock(n.text)}</div></div>`).join('')}</div>` : ''}`
		const er = $('#er', el)
		if (!er) return
		const svg = $('svg', er)
		const focus = (slug) => {
			er.classList.add('focusing')
			const ls = $$('.rel, .many', svg).filter((l) => l.dataset.a === slug || l.dataset.b === slug)
			const ids = new Set([slug, ...ls.flatMap((l) => [l.dataset.a, l.dataset.b])])
			for (const g of $$('.ent', svg)) g.classList.toggle('hl', ids.has(g.dataset.ent))
			for (const l of $$('.rel, .many', svg)) l.classList.toggle('hl', ls.includes(l))
		}
		const blur = () => { er.classList.remove('focusing'); for (const x of $$('.hl', svg)) x.classList.remove('hl') }
		svg.addEventListener('mouseover', (e) => { const g = e.target.closest('.ent'); if (g) focus(g.dataset.ent) })
		svg.addEventListener('mouseout', (e) => { const g = e.target.closest('.ent'); if (g && !g.contains(e.relatedTarget)) blur() })
		svg.addEventListener('click', (e) => { const g = e.target.closest('.ent'); if (g) openPanel(`entity:${g.dataset.ent}`) })
		svg.addEventListener('keydown', (e) => { const g = e.target.closest('.ent'); if (g && e.key === 'Enter') openPanel(`entity:${g.dataset.ent}`) })
	}

	// ---------- access
	RENDER.access = (el) => {
		const X = C.access
		const cell = (c) => (c === '✓' || c === true ? '<span class="yes" aria-label="yes">✓</span>' : !c ? '<span class="no" aria-label="no">–</span>' : `<span class="cond">${md(String(c))}</span>`)
		const withStatus = (X.actions || []).some((a) => a.status)
		const rules = CODE.symbols.filter((x) => ['access', 'proxy'].includes(x.kind))
		el.innerHTML = `${vhead('Who can do what', md(X.intro || 'Who may see and change what, and where that is decided.'))}
		${X.actions?.length ? `<div class="sect" style="margin-top:0">
			<h3>${esc(X.title || 'Permissions')}</h3>
			${X.lead ? `<p class="lead tx">${md(X.lead)}</p>` : ''}
			<div class="card scroll-x" style="padding:4px"><table class="t"><thead><tr><th>Action</th>${(X.roles || []).map((r) => `<th style="text-align:center">${esc(r)}</th>`).join('')}${withStatus ? '<th>Status</th>' : ''}</tr></thead><tbody>${X.actions.map((a) => `<tr><td class="tx">${md(a.action)}</td>${(a.cells || []).map((c) => `<td class="c">${cell(c)}</td>`).join('')}${withStatus ? `<td>${chip(a.status)}</td>` : ''}</tr>`).join('')}</tbody></table></div>

				${section('Real tables', e.tables?.length ? refs(e.tables.map((t) => `<button type="button" class="ref" data-open="table:${t.name}"><span class="mono">${esc(t.name)}</span></button>`)) : '')}

				kind: 'Database table',

				${ent ? section('Belongs to', refs([`<button type="button" class="ref" data-open="entity:${ent}">${esc(ent)}</button>`])) : ''}
				${section(`Columns (${t.columns.length})`, `<div class="scroll-x"><table class="t"><thead><tr><th>Column</th><th>Meaning</th><th class="L-tech">Type</th></tr></thead><tbody>${t.columns.map((col) => `<tr><td class="mono small">${esc(col.name)}${col.required ? '' : ' <span class="muted">(optional)</span>'}</td><td class="small tx">${md(c.columns?.[col.name] || C.commonColumns[col.name] || '')}</td><td class="mono small L-tech" style="border:0">${esc(col.type)}${col.primaryKey ? ' · key' : ''}${col.default ? ` · default ${esc(col.default)}` : ''}</td></tr>`).join('')}</tbody></table></div>`)}
				${t.links.length ? section('Points to', `<ul class="links">${t.links.map((l) => `<li>${F.schema.tables.some((x) => x.name === l.table) ? `<button type="button" class="ref" data-open="table:${esc(l.table)}"><span class="mono">${esc(l.column)} → ${esc(l.table)}</span></button>` : `<span class="mono small">${esc(l.column)} → ${esc(l.table)}</span>`}${l.onDelete ? `<small>when that row is deleted: ${esc(l.onDelete)}</small>` : ''}</li>`).join('')}</ul>`) : ''}
				${(() => {
					const by = (k) => CODE.symbols.filter((x) => (x.effects || []).some((f) => f.k === k && f.on === name)).map((x) => fnRef(x.id))
					const r = by('db-read')
					const w = by('db-write')
					return `${section('Read by the code', r.length ? refs(r) : '')}${section('Changed by the code', w.length ? refs(w) : '')}`
				})()}`,
			}
		},

				${a.assumption ? section('Working answer', `<p class="tx">${md(a.assumption)}</p>`) : ''}

				${a.ifDiffers ? section('If the answer is different', `<p class="tx">${md(a.ifDiffers)}</p>`) : ''}

				kind: 'Environment variable',
				html: `<h2 class="mono" style="font-family:var(--mono);font-size:1.15rem;overflow-wrap:anywhere">${esc(name)}</h2>
				<div class="row">${chip(v.status)}${v.secret ? `<span class="kind">${lockIcon} secret: never in Git</span>` : ''}</div>
				<p class="tx">${md(v.explain || v.notes || '')}</p>
				<dl class="kv">${v.required ? `<dt>Required</dt><dd>${md(v.required)}</dd>` : ''}${v.validation ? `<dt>Rule</dt><dd>${md(v.validation)}</dd>` : ''}${v.notes && v.explain ? `<dt>Note</dt><dd>${md(v.notes)}</dd>` : ''}${F.env.schemaFile ? `<dt>Checked at startup</dt><dd>${v.inSchema ? `Yes, in <code>${esc(F.env.schemaFile)}</code>` : 'No'}</dd>` : ''}<dt>Read by the code</dt><dd>${v.used ? 'Yes' : 'Not found in the code'}</dd></dl>
				${refs([F.env.exampleFile && v.section !== undefined ? fileRef(F.env.exampleFile) : '', v.inSchema ? fileRef(F.env.schemaFile) : ''].filter(Boolean))}
				${(() => { const by = CODE.symbols.filter((x) => x.env?.includes(name)); return by.length ? section('Read by', refs(by.map((x) => fnRef(x.id)))) : '' })()}`,
			}

				html: `<h2>${esc(t.id)}: ${md(t.threat)}</h2><div class="row">${chip(t.status)}<span class="stride">${t.stride.map((s) => `<abbr title="${esc(STRIDE[s])}">${s}</abbr>`).join('')}</span></div>
				${t.stride.map((s) => `<p class="small muted">${esc(STRIDE[s])}</p>`).join('')}
				${section('Stopped by', t.mitigation ? `<p class="tx">${md(t.mitigation)}</p>` : '')}
				${section('Proven by', t.verifiedBy ? `<p class="tx">${md(t.verifiedBy)}</p>` : '')}

				html: `<h2>${esc(j.title)}</h2><p class="tx">${md(j.simple)}</p><ol class="jsteps tx">${j.steps.map((s) => `<li>${md(s.text)} ${chip(stepStatus(s))}</li>`).join('')}</ol><div><button type="button" class="btn primary" data-journey="${j.id}">▶ Play it on the map</button></div>`,

		command(key) {
			const i = key.indexOf(':')
			const dir = key.slice(0, i)
			const name = key.slice(i + 1)

			if (raw == null) return null
			return {

				html: `<h2 class="mono" style="font-family:var(--mono);font-size:1.15rem">${esc(cmdName(pk, name))}</h2><p class="tx">${md(C.commands[key] || '')}</p>${section('Runs', `<pre>${esc(raw)}</pre>`)}${section('Defined in', refs([fileRef(pk.dir ? `${pk.dir}/package.json` : 'package.json')]))}`,
			}

		route(url) {
			const r = F.routes.find((x) => x.url === url)

			const handlers = CODE.entries.filter((e) => SYM[e.id]?.file === r.file).map((e) => fnRef(e.id))
			return { kind: 'Address', html: `<h2 class="mono" style="font-family:var(--mono);font-size:1.3rem">${esc(url)}</h2><p class="tx">${md(C.routes[url] || '')}</p>${refs([fileRef(r.file)])}${section('Handled by', handlers.length ? refs(handlers) : '')}` }

		fn(id) {
			const s = SYM[id]
			if (!s) return null
			const e = ENTRY[id]
			const ups = callersOf[id] || []
			const wires = wiredBy[id] || []
			const tests = CODE.tests[id] || []
			const rets = []
			const stops = []
			const conds = []
			walkSteps(s.outline, (st) => {
				if (st.t === 'ret' && !st.jsx && st.v && !rets.includes(st.v)) rets.push(st.v)
				if (st.t === 'throw') stops.push(`Stops with an error: <code>${esc(st.v)}</code>`)
				if (st.t === 'fx' && (st.k === 'redirect' || st.k === 'notfound' || st.k === 'exit')) stops.push(`${FX[st.k][2](st)}: <code>${esc(st.v)}</code>`)
				if (st.t === 'if') conds.push(`${st.missing ? 'If missing: ' : st.unless ? 'Unless: ' : ''}${st.c}`)
				if (st.t === 'switch') conds.push(`Depending on: ${st.c}`)
				if (st.t === 'loop') conds.push(st.w === 'each' ? `For each: ${st.c}` : st.c ? `While: ${st.c}` : 'Repeats until told to stop')
			})
			const reached = reachedFrom(id)
			const fxSeen = new Map()
			for (const f of s.effects || []) {
				const k = `${f.k}|${f.on || ''}|${f.fn}`
				if (!fxSeen.has(k)) fxSeen.set(k, { f, lines: [] })
				fxSeen.get(k).lines.push(f.line)
			}
			const typeRefs = (list) => (list?.length ? `<div class="refs" style="margin-top:4px">${list.map((r) => fnRef(r)).join('')}</div>` : '')
			const pRow = (p, part) => `<tr${part ? ' class="part"' : ''}><td>${part ? '.' : ''}${esc(p.rest ? `…${p.name}` : p.parts ? 'an object with' : p.name)}${p.opt ? '<span class="muted">?</span>' : ''}</td><td><span class="pt">${esc(p.parts ? (p.type === 'an object' ? '' : p.type) : p.type || '')}</span>${p.def ? ` <span class="small muted">default <code>${esc(p.def)}</code></span>` : ''}${p.doc ? `<div class="small tx">${md(p.doc)}</div>` : ''}${typeRefs(p.refs)}</td></tr>`
			const testsHtml = [...new Set(tests.map((t) => t.file))].map((f) => `<div style="margin-bottom:6px">${fileRef(f)}<ul class="tcases">${tests.filter((t) => t.file === f).map((t) => `<li><span>${esc(t.title || 'setup for the tests in this file')}</span></li>`).join('')}</ul></div>`).join('')
			return {
				kind: `${FN_KIND[s.kind]?.[0] || 'Code'} · ${base(s.file)}`,
				html: `<h2 style="overflow-wrap:anywhere">${esc(fnName(s))}</h2>
				<p class="path">${esc(s.file)} · line ${s.line}${s.end > s.line ? `–${s.end}` : ''}</p>
				<div class="row">${fkb(s.kind)}${s.async ? '<span class="kind" title="It waits for things like the database">async</span>' : ''}${s.name === '(top level)' ? '' : `<span class="kind">${IS_PY(s.file) ? (s.parent && s.kind !== 'method' ? 'lives inside another function' : s.exported ? 'public' : 'meant for its own file (name starts with _)') : s.exported ? 'exported' : 'used only in its file'}</span>`}${s.runs ? `<span class="kind">${s.runs === 'browser' ? 'runs in the browser' : 'server action file'}</span>` : ''}${s.wrapper ? `<span class="kind">wrapped in ${esc(s.wrapper)}</span>` : ''}${tests.length ? '<span class="kind">has tests</span>' : ''}</div>
				<div class="tx fdoc">${s.doc ? mdBlock(s.doc) : `<p>${md(autoSummary(s))}</p>`}</div>
				<p class="small muted">${esc(FN_KIND[s.kind]?.[1] || '')}</p>
				${s.kind !== 'type' ? `<div>${sigHtml(s)}</div>` : ''}
				${s.outline?.length || s.links?.length || ups.length ? `<div><button type="button" class="btn primary" data-follow="${esc(id)}">Follow it on the Functions map →</button></div>` : ''}
				${e ? section('Starts when', `<p class="tx mono small">${esc(e.trigger)}</p>`) : ''}
				${s.params ? section('Takes', s.params.length ? `<table class="ptable"><tbody>${s.params.map((p) => pRow(p) + (p.parts || []).map((x) => pRow(x, true)).join('')).join('')}</tbody></table>` : '<p class="small muted">Nothing.</p>') : ''}
				${s.returns ? section('Gives back', `<p class="mono small">${esc(s.returns)}</p>${typeRefs(s.retRefs)}${rets.length ? `<p class="small muted" style="margin-top:6px">The actual results it returns:</p><ul class="links">${rets.map((r) => `<li><code>${esc(r)}</code></li>`).join('')}</ul>` : ''}`) : ''}
				${stops.length ? section('Stops early', `<ul class="links">${[...new Set(stops)].map((x) => `<li><span class="small">${x}</span></li>`).join('')}</ul>`) : ''}
				${s.members ? section(`Fields (${s.members.length})`, `<table class="ptable"><tbody>${s.members.map((m) => `<tr><td>${esc(m.name)}${m.opt ? '<span class="muted">?</span>' : ''}</td><td><span class="pt">${esc(m.type)}</span>${m.doc ? `<div class="small tx">${md(m.doc)}</div>` : ''}</td></tr>`).join('')}</tbody></table>`) : ''}
				${s.value ? section(s.kind === 'type' ? 'Is' : 'Value', `<pre>${esc(s.value)}</pre>${s.declared ? `<p class="small muted mono" style="margin-top:4px">${esc(s.declared)}</p>` : ''}`) : ''}
				${conds.length ? `<div class="L-detail">${section(`Decisions (${conds.length})`, `<ul class="links">${conds.map((c) => `<li><code>${esc(c)}</code></li>`).join('')}</ul>`)}</div>` : ''}
				${section('Calls', s.links?.length ? refs(s.links.map((l) => fnRef(l.id))) : '')}
				${section('Called by', ups.length || wires.length ? refs([...ups.map((c) => fnRef(c.id)), ...wires.map((w) => fnRef(w.from, `${SYM[w.from] ? fnName(SYM[w.from]) : ''} · ${w.at}`))]) : `<p class="small muted">Nothing in the app calls it${e ? ': it starts on its own (above).' : s.kind === 'type' ? ' (types are only checked, never called).' : '.'}</p>`)}
				${reached.length ? section('Reached from these entry points', refs(reached.map((r) => fnRef(r, `${fnName(SYM[r])} · ${fit(ENTRY[r].trigger, 48)}`)))) : ''}
				${fxSeen.size ? section('Touches outside our code', `<ul class="links">${[...fxSeen.values()].map(({ f, lines }) => `<li><span>${FX[f.k]?.[1] || ''} ${(FX[f.k] || FX.lib)[2](f)}</span><small>line ${lines.join(', ')}</small></li>`).join('')}</ul>`) : ''}
				${s.env?.length ? section('Reads settings', refs(s.env.map((n) => `<button type="button" class="ref" data-open="env:${esc(n)}"><span class="mono">${esc(n)}</span></button>`))) : ''}
				${tests.length ? section(`Checked by tests (${tests.length})`, testsHtml) : ''}
				${s.outline?.length ? `<div class="L-detail">${section('What it does, step by step', `<div class="hide-minor">${stepsHtml(s.outline, [id])}</div>`)}</div>` : ''}
				<div class="L-tech">${section('The code', sourceHtml(s))}</div>
				${section('File', refs([fileRef(s.file)]))}`,
			}
		},
	}

	function openPanel(ref, { push = true } = {}) {
		const [type, ...rest] = ref.split(':')
		const id = rest.join(':')
		const r = PANELS[type]?.(id)
		if (!r) return
		if (push) {
			if (!panel.classList.contains('open')) history_ = []
			history_.push(ref)
		}
		$('#pkind').textContent = r.kind
		pbody.innerHTML = r.html
		linkTerms(pbody)
		pbody.scrollTop = 0
		$('#pback').hidden = history_.length < 2
		panel.classList.add('open')
		panel.setAttribute('aria-hidden', 'false')
		scrim.classList.add('on')
		pbody.focus({ preventScroll: true })
	}
	function closePanel() {
		panel.classList.remove('open')
		panel.setAttribute('aria-hidden', 'true')
		scrim.classList.remove('on')
		history_ = []
	}
	$('#pclose').addEventListener('click', closePanel)
	scrim.addEventListener('click', closePanel)
	$('#pback').addEventListener('click', () => { history_.pop(); const prev = history_[history_.length - 1]; if (prev) openPanel(prev, { push: false }) })

	// ------------------------------------------------------------ tooltip
	const tip = $('#tip')
	let tipFor = null
	let tipT = 0
	function showTip(el) {
		clearTimeout(tipT)
		const g = TERMS[+el.dataset.term]
		tipFor = el
		tip.innerHTML = `<b>${esc(g.term)}</b>${md(g.simple)}<div class="row">${g.node ? `<button type="button" data-open="node:${g.node}">Show the part</button>` : ''}<button type="button" data-open="term:${el.dataset.term}">Details</button></div>`
		tip.hidden = false
		const r = el.getBoundingClientRect()
		const tw = tip.offsetWidth
		const th = tip.offsetHeight
		let x = Math.min(Math.max(12, r.left + r.width / 2 - tw / 2), window.innerWidth - tw - 12)
		let y = r.bottom + 8
		if (y + th > window.innerHeight - 12) y = r.top - th - 8
		tip.style.left = `${x}px`
		tip.style.top = `${Math.max(8, y)}px`
	}
	const hideTip = () => { tip.hidden = true; tipFor = null }
	document.addEventListener('mouseover', (e) => {
		const t = e.target.closest('.term')
		if (t) { clearTimeout(tipT); tipT = setTimeout(() => showTip(t), 140); return }
		if (e.target.closest('#tip')) { clearTimeout(tipT); return }
		if (tipFor) { clearTimeout(tipT); tipT = setTimeout(hideTip, 220) }
	})
	document.addEventListener('focusin', (e) => { const t = e.target.closest('.term'); if (t) showTip(t) })

	// ------------------------------------------------------------ search
	const INDEX = [
		...C.nodes.map((n) => ({ k: n.person ? 'People' : 'Part', t: n.label, s: n.simple, ref: `node:${n.id}` })),
		...C.journeys.map((j) => ({ k: 'Journey', t: j.title, s: j.simple, ref: `journey:${j.id}` })),
		...F.files.map((f) => ({ k: 'File', t: fileInfo(f.path).title, s: f.path, ref: `file:${f.path}`, x: fileInfo(f.path).simple })),
		...F.folders.filter((p) => C.folders[p]).map((p) => ({ k: 'Folder', t: `${base(p)}/`, s: p, ref: `folder:${p}`, x: C.folders[p].simple })),
		...Object.values(ENT).map((e) => ({ k: 'Data', t: e.slug, s: e.simple || '', ref: `entity:${e.slug}` })),
		...F.schema.tables.map((t) => ({ k: 'Table', t: t.name, s: C.tables[t.name]?.simple || '', ref: `table:${t.name}` })),
		...Object.values(A).map((a) => ({ k: 'Question', t: `${a.id} ${a.question}`, s: a.assumption || '', ref: `assumption:${a.id}` })),
		...[...ENV.values()].map((v) => ({ k: 'Env var', t: v.name, s: v.explain || v.notes || '', ref: `env:${v.name}` })),
		...TERMS.map((g, i) => ({ k: 'Term', t: g.term, s: g.simple, ref: `term:${i}`, x: (g.aliases || []).join(' ') })),
		...F.routes.map((r) => ({ k: 'Address', t: r.url, s: C.routes[r.url] || '', ref: `route:${r.url}` })),
		...THREATS.map((t) => ({ k: 'Threat', t: `${t.id} ${t.threat}`, s: t.mitigation, ref: `threat:${t.id}` })),
		...F.adrs.map((a) => ({ k: 'Decision', t: a.title, s: `ADR ${a.number}`, ref: `adr:${a.number}` })),
		...MS.map((m) => ({ k: 'Milestone', t: m.name, s: m.simple, ref: `milestone:${m.id}` })),
		...CODE.symbols.map((x) => ({ k: x.kind === 'type' ? 'Type' : x.kind === 'component' ? 'Component' : 'Function', t: fnName(x), s: `${shortPath(x.file)}:${x.line}`, ref: `fn:${x.id}`, x: x.doc || '' })),
		...F.packages.list.flatMap((pk) => Object.keys(pk.scripts).map((n) => ({ k: 'Command', t: cmdName(pk, n), s: C.commands[cmdKey(pk, n)] || '', ref: `command:${cmdKey(pk, n)}` }))),
	].map((x) => ({ ...x, hay: `${x.t} ${x.s} ${x.x || ''}`.toLowerCase().replace(/[`*]/g, '') }))
	const qi = $('#q')
	const res = $('#results')
	let hits = []
	let sel = 0
	function search() {
		const q = qi.value.trim().toLowerCase()
		if (!q) { res.hidden = true; return }
		const words = q.split(/\s+/)
		hits = INDEX.map((x) => {
			if (!words.every((w) => x.hay.includes(w))) return null
			const t = x.t.toLowerCase()
			const score = (t === q ? 100 : t.startsWith(q) ? 60 : t.includes(q) ? 40 : 0) + (x.k === 'Part' ? 8 : x.k === 'Term' ? 6 : 0)
			return { ...x, score }
		}).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 14)
		sel = 0
		res.innerHTML = hits.length ? hits.map((h, k) => `<button type="button" class="${k === sel ? 'on' : ''}" data-hit="${k}"><span class="k">${h.k}</span><span class="t"><b>${mdp(h.t)}</b><small>${esc((h.s || '').replace(/[`*]/g, ''))}</small></span></button>`).join('') : '<p class="none">Nothing matches. Try a simpler word.</p>'
		res.hidden = false
	}
	function pick(k) {
		const h = hits[k]
		if (!h) return
		res.hidden = true
		qi.blur()
		openPanel(h.ref)
	}
	qi.addEventListener('input', search)
	qi.addEventListener('focus', () => { if (qi.value.trim()) search() })
	qi.addEventListener('keydown', (e) => {
		if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
			e.preventDefault()
			sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(hits.length, 1)
			$$('button', res).forEach((b, k) => b.classList.toggle('on', k === sel))
		}
		if (e.key === 'Enter') { e.preventDefault(); pick(sel) }
		if (e.key === 'Escape') { res.hidden = true; qi.blur() }
	})
	res.addEventListener('click', (e) => { const b = e.target.closest('[data-hit]'); if (b) pick(+b.dataset.hit) })

	// ------------------------------------------------------------ global events
	document.addEventListener('click', (e) => {
		if (!e.target.closest('.search')) res.hidden = true
		const t = e.target.closest('.term')
		if (t) { showTip(t); return }
		if (!e.target.closest('#tip')) hideTip()
		const j = e.target.closest('[data-journey]')
		if (j) { closePanel(); show('journeys'); J.select(j.dataset.journey); return }
		const cp = e.target.closest('[data-codepath]')
		if (cp) { codePath = cp.dataset.codepath; closePanel(); if (rendered.code) drawTree(); show('code'); return }
		const xp = e.target.closest('[data-expand]')
		if (xp) { toggleExpand(xp); return }
		const fl = e.target.closest('[data-follow]')
		if (fl) {
			closePanel()
			fnFocus = fl.dataset.follow
			store.set('fnFocus', fnFocus)
			if (rendered.functions) drawExplorer()
			show('functions', { scroll: false })
			$('#fx-follow')?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' })
			return
		}
		const go = e.target.closest('[data-go]')
		if (go) { show(go.dataset.go); return }
		const o = e.target.closest('[data-open]')
		if (o) { e.preventDefault(); hideTip(); openPanel(o.dataset.open) }
	})
	document.addEventListener('keydown', (e) => {
		if (e.key === 'Escape') { if (!tip.hidden) hideTip(); else if (panel.classList.contains('open')) closePanel() }
		const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '')
		if (!typing && (e.key === '/' || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey)))) { e.preventDefault(); qi.focus(); qi.select() }
		if (!typing) J.key(e)
		if (e.key === 'Enter' && e.target.closest?.('.term')) showTip(e.target.closest('.term'))
		if (e.key === 'Enter' && e.target.matches?.('tr[data-open]')) openPanel(e.target.dataset.open)
	})
	window.addEventListener('hashchange', () => show(location.hash.slice(1)))

	show(location.hash.slice(1) || store.get('view') || 'overview', { scroll: false })
})()
</script>
